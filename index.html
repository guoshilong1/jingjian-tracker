/* ============ 工具函数 ============ */
function isoWeek(date) {
  const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
  const dayNum = (d.getUTCDay() + 6) % 7;
  d.setUTCDate(d.getUTCDate() - dayNum + 3);
  const firstThursday = new Date(Date.UTC(d.getUTCFullYear(), 0, 4));
  const week = 1 + Math.round(((d - firstThursday) / 86400000 - 3 + ((firstThursday.getUTCDay() + 6) % 7)) / 7);
  return d.getUTCFullYear() + '-W' + String(week).padStart(2, '0');
}
function uid() { return 'm_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8); }
function todayStr() {
  const d = new Date(); const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
}

function formatDateTime(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  const p = n => String(n).padStart(2, '0');
  return `${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

/* ============ 数据层（Supabase 优先，localStorage 兜底） ============ */
function loadLocal() { try { return JSON.parse(localStorage.getItem(LOCAL_KEY) || '[]'); } catch (e) { return []; } }
function saveLocal(arr) { localStorage.setItem(LOCAL_KEY, JSON.stringify(arr)); }

async function loadRecords() {
  const local = loadLocal();
  try {
    const { data, error } = await supabase.from(TABLE).select('*').order('created_at', { ascending: false });
    if (error) throw error;
    const cloud = data || [];
    // 合并本地兜底（离线时写入的）与云端记录，避免提交后“消失”
    const cloudIds = new Set(cloud.map(r => r.id));
    const merged = [...cloud, ...local.filter(r => !cloudIds.has(r.id))];
    return merged.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
  } catch (e) {
    console.warn('[load] 云端失败，用本地兜底', e.message);
    return local;
  }
}
async function insertRecord(rec) {
  // Supabase 表 id 是 uuid，不能传自定义字符串；让数据库自生成
  const payload = { ...rec };
  delete payload.id;
  try {
    const { data, error } = await supabase.from(TABLE).insert(payload).select();
    if (error) throw error;
    return data && data[0] ? data[0] : rec;
  } catch (e) {
    console.warn('[insert] 云端失败，写本地', e.message);
    const local = loadLocal(); local.push(rec); saveLocal(local); return rec;
  }
}
async function updateRecord(id, items) {
  const ts = Date.now();
  try {
    const { error } = await supabase.from(TABLE).update({ items, updated_at: ts }).eq('id', id);
    if (error) throw error;
    return true;
  } catch (e) {
    console.warn('[update] 云端失败，写本地', e.message);
    const local = loadLocal().map(r => r.id === id ? { ...r, items, updated_at: ts } : r);
    saveLocal(local); return false;
  }
}

// 把仅存于本机浏览器（localStorage）的记录迁移到 Supabase 云端，便于手机/其他设备查看
async function migrateLocalToCloud() {
  const local = loadLocal();
  if (!local.length) return 0;
  let ok = 0;
  for (const rec of local) {
    const payload = { ...rec };
    delete payload.id; // 让 Supabase 生成 uuid，避免与云端冲突
    try {
      const { error } = await supabase.from(TABLE).insert(payload);
      if (error) throw error;
      ok++;
    } catch (e) {
      console.warn('[migrate] 单条失败', e.message);
    }
  }
  saveLocal([]); // 迁移完成后清空本地兜底
  return ok;
}

/* ============ 防摸鱼：3 分钟无操作关闭 ============ */
function useAutoClose(onClose) {
  const [show, setShow] = useState(false);
  const timer = useRef(null);
  const closeTimer = useRef(null);
  const reset = useCallback(() => {
    setShow(false);
    if (closeTimer.current) clearTimeout(closeTimer.current);
    if (timer.current) clearTimeout(timer.current);
    timer.current = setTimeout(() => {
      setShow(true);
      closeTimer.current = setTimeout(() => onClose(), 10000);
    }, 180000);
  }, [onClose]);
  useEffect(() => {
    const acts = ['mousemove', 'mousedown', 'keydown', 'touchstart', 'scroll'];
    acts.forEach(a => window.addEventListener(a, reset, { passive: true }));
    reset();
    return () => {
      acts.forEach(a => window.removeEventListener(a, reset));
      if (timer.current) clearTimeout(timer.current);
      if (closeTimer.current) clearTimeout(closeTimer.current);
    };
  }, [reset]);
  return { show, cancel: reset };
}

function emptyItem() { return { id: uid(), period: 'weekday', category: 'product', sub: PRODUCT_SUBS[0], desc: '', images: [], solution: '', due_date: '', status: 'pending', rework_note: '' }; }

function compressImage(file, maxDim = 800, quality = 0.72) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const reader = new FileReader();
    reader.onload = e => {
      img.onload = () => {
        let w = img.width, h = img.height;
        if (w > h && w > maxDim) { h = Math.round(h * maxDim / w); w = maxDim; }
        else if (h > maxDim) { w = Math.round(w * maxDim / h); h = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, w, h);
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function SubmitView({ currentStore, onSubmitted }) {
  const [target, setTarget] = useState(currentStore);
  const [items, setItems] = useState([emptyItem()]);
  const [saving, setSaving] = useState(false);
  const [err, setErr] = useState('');

  useEffect(() => { setTarget(currentStore); }, [currentStore]);

  const setItem = (i, patch) => setItems(prev => prev.map((it, idx) => idx === i ? { ...it, ...patch } : it));
  const addItem = () => setItems(prev => prev.length < 3 ? [...prev, { ...emptyItem(), period: prev[prev.length - 1]?.period || 'weekday' }] : prev);
  const delItem = (i) => setItems(prev => prev.length > 1 ? prev.filter((_, idx) => idx !== i) : prev);

  const onCat = (i, cat) => setItem(i, { category: cat, sub: SUBS_BY_CAT[cat][0] });

  const submit = async () => {
    setErr('');
    const filled = items.filter(it => it.desc.trim());
    if (filled.length < 1 || filled.length > 3) { setErr('请填写 1–3 个问题'); return; }
    if (!target) { setErr('请选择被检查的门店'); return; }
    setSaving(true);
    const rec = {
      id: uid(),
      submitter_store: currentStore,
      target_store: target,
      period: filled[0].period, // 记录级 period 取首个问题时段，兼容旧数据
      week_label: isoWeek(new Date()),
      items: items.map(it => ({ ...it, desc: it.desc.trim(), solution: it.solution.trim(), rework_note: it.rework_note.trim() })),
      created_at: new Date().toISOString(),
      updated_at: new Date().toISOString(),
    };
    try {
      await insertRecord(rec);
      onSubmitted();
    } catch (e) {
      setErr('提交失败：' + e.message);
    } finally {
      setSaving(false);
    }
  };

  return (
    <div className="max-w-3xl mx-auto px-4 py-6 fade-in">
      <h2 className="text-lg font-bold text-gray-900 mb-1">提交镜检</h2>
      <p className="text-sm text-gray-500 mb-5">看负责门店的监控回放，找出最该改的 1–3 件事。</p>

      <div className="bg-white border border-gray-200 rounded-xl p-5 mb-4">
        <div className="mb-4">
          <label className="block text-xs text-gray-500 mb-1">被检查门店（可跨店帮带）</label>
          <select value={target} onChange={e => setTarget(e.target.value)}
            className="w-full bg-gray-50 border border-gray-300 rounded-lg px-3 py-2 text-gray-900 focus:border-indigo-500 outline-none">
            {STORE_LIST.map(s => <option key={s} value={s}>{s}</option>)}
          </select>
        </div>

        <div className="space-y-3">
          {items.map((it, i) => (
            <div key={it.id} className="border border-gray-200 rounded-lg p-4 bg-gray-50">
              <div className="flex items-center justify-between mb-3 flex-wrap gap-2">
                <span className="text-sm font-medium text-indigo-600">问题 {i + 1}</span>
                <div className="flex items-center gap-2">
                  <span className="text-xs text-gray-500">检查时段</span>
                  {['weekday', 'weekend'].map(p => (
                    <button key={p} onClick={() => setItem(i, { period: p })}
                      className={`px-2.5 py-1 rounded-md text-xs font-medium border transition ${it.period === p ? 'bg-indigo-50 text-indigo-700 border-indigo-300' : 'text-gray-600 border-gray-300 hover:bg-gray-100'}`}>
                      {PERIOD_LABELS[p]}
                    </button>
                  ))}
                  {items.length > 1 && (
                    <button onClick={() => delItem(i)} className="ml-1 text-xs text-gray-500 hover:text-rose-400">删除</button>
                  )}
                </div>
              </div>
              <div className="flex gap-2 mb-3">
                {['product', 'service'].map(c => (
                  <button key={c} onClick={() => onCat(i, c)}
                    className={`px-3 py-1.5 rounded-lg text-xs font-medium border transition ${it.category === c ? 'bg-indigo-50 text-indigo-700 border-indigo-300' : 'text-gray-600 border-gray-300 hover:bg-gray-100'}`}>
                    {c === 'product' ? '产品' : '服务'}
                  </button>
                ))}
                <select value={it.sub} onChange={e => setItem(i, { sub: e.target.value })}
                  className="flex-1 bg-gray-50 border border-gray-300 rounded-lg px-2 py-1.5 text-sm text-gray-900 focus:border-indigo-500 outline-none">
                  {SUBS_BY_CAT[it.category].map(s => <option key={s} value={s}>{s}</option>)}
                </select>
              </div>
              <textarea value={it.desc} onChange={e => setItem(i, { desc: e.target.value })}
                rows={3} placeholder="描述你看到的问题（建议找伙伴确认他能理解你写的话）"

              <div className="bg-white border border-gray-200 rounded-lg p-3">

                  <span className="text-xs text-gray-400">{(it.images || []).length}/3</span>
                </div>
                {(it.images || []).length > 0 && (
                  <div className="flex flex-wrap gap-2 mb-2">
                    {(it.images || []).map((src, idx) => (
                      <div key={idx} className="relative w-16 h-16 rounded-lg border border-gray-200 overflow-hidden bg-gray-100">
                        <img src={src} alt={`图片 ${idx + 1}`} className="w-full h-full object-cover" />
                        <button onClick={() => setItem(i, { images: it.images.filter((_, j) => j !== idx) })}
                          className="absolute top-0.5 right-0.5 w-5 h-5 rounded-full bg-black/50 text-white text-xs flex items-center justify-center hover:bg-black/70">×</button>
                      </div>

                {(it.images || []).length < 3 && (

                    上传图片
                    <input type="file" accept="image/*" multiple className="hidden"
                      onChange={async e => {
                        const files = Array.from(e.target.files || []);
                        const remaining = 3 - (it.images || []).length;
                        const toAdd = files.slice(0, remaining);
                        const compressed = await Promise.all(toAdd.map(f => compressImage(f).catch(() => null)));
                        const added = compressed.filter(Boolean);
                        setItem(i, { images: [...(it.images || []), ...added] });
                        e.target.value = '';
                      }} />
                  </label>
                )}
              </div>
            </div>
          ))}
        </div>

        {items.length < 3 && (
          <button onClick={addItem} className="mt-3 w-full py-2 rounded-lg border border-dashed border-gray-300 text-sm text-gray-600 hover:border-indigo-500 hover:text-indigo-600 transition">+ 再加一个问题（最多 3 个）</button>
        )}
      </div>

      {err && <p className="text-rose-400 text-sm mb-3">{err}</p>}
      <button onClick={submit} disabled={saving}
        className="w-full py-2.5 rounded-lg bg-indigo-600 hover:bg-indigo-500 disabled:opacity-50 text-white font-medium transition">
        {saving ? '提交中…' : '提交镜检'}
      </button>
    </div>
  );
}

function DashboardView({ records, currentStore, onReload }) {

  const [periodFilter, setPeriodFilter] = useState('all');
  const [statusFilter, setStatusFilter] = useState('all');
  const [rework, setRework] = useState(null);

  const allItems = useMemo(() => {
    const out = [];
    records.forEach(r => (r.items || []).forEach(it => out.push({ ...it, _record: r })));
    return out;
  }, [records]);

  const filtered = allItems.filter(it => {
    if (storeFilter !== 'all' && it._record.target_store !== storeFilter) return false;
    const itemPeriod = it.period || it._record.period;
    if (periodFilter !== 'all' && itemPeriod !== periodFilter) return false;
    if (statusFilter !== 'all' && it.status !== statusFilter) return false;
    return true;
  });

  const grouped = useMemo(() => {
    const m = {};
    filtered.forEach(it => {
      const k = it._record.target_store;
      (m[k] = m[k] || []).push(it);
    });
    return m;
  }, [filtered]);

  const canEdit = (rec) => rec.target_store === currentStore;

  const saveRework = async () => {
    const { recordId, itemId, solution, due_date, status, rework_note } = rework;
    const rec = records.find(r => r.id === recordId);
    if (!rec) return;
    const newItems = rec.items.map(it =>
      it.id === itemId ? { ...it, solution, due_date, status, rework_note: status === 'overdue' ? rework_note : it.rework_note } : it
    );
    await updateRecord(recordId, newItems);
    setRework(null);
    onReload();
  };

  return (
    <div className="max-w-5xl mx-auto px-4 py-6 fade-in">
      <h2 className="text-lg font-bold text-gray-900 mb-1">管理看板 · 按门店汇总</h2>

          className="bg-gray-50 border border-gray-300 rounded-lg px-2 py-1.5 text-sm text-gray-900 outline-none">

          {STORE_LIST.map(s => <option key={s} value={s}>{s}</option>)}

        <select value={statusFilter} onChange={e => setStatusFilter(e.target.value)}

                  <Badge text={it.sub} />

                </div>

                {it.solution && <p className="text-xs text-emerald-600 mb-1">方案：{it.solution}{it.due_date ? `（节点 ${it.due_date}）` : ''}</p>}

}

/* ============ 门店看板（当前门店视角） ============ */
function StoreDashboardView({ records, currentStore, onReload }) {
  const [ownFilter, setOwnFilter] = useState('all');
  const [otherFilter, setOtherFilter] = useState('all');
  const [rework, setRework] = useState(null);

  const ownItems = useMemo(() => {
    const out = [];
    records.filter(r => r.target_store === currentStore).forEach(r => (r.items || []).forEach(it => out.push({ ...it, _record: r })));
    return out.sort((a, b) => new Date(b._record.created_at) - new Date(a._record.created_at));
  }, [records, currentStore]);

  const otherItems = useMemo(() => {
    const out = [];
    records.filter(r => r.submitter_store === currentStore && r.target_store !== currentStore).forEach(r => (r.items || []).forEach(it => out.push({ ...it, _record: r })));
    return out.sort((a, b) => new Date(b._record.created_at) - new Date(a._record.created_at));
  }, [records, currentStore]);

  const total = ownItems.length;
  const pending = ownItems.filter(i => i.status === 'pending').length;
  const done = ownItems.filter(i => i.status === 'done').length;
  const overdue = ownItems.filter(i => i.status === 'overdue').length;

  const productCnt = ownItems.filter(i => i.category === 'product').length;
  const serviceCnt = ownItems.filter(i => i.category === 'service').length;
  const productPct = total ? Math.round(productCnt / total * 100) : 0;
  const servicePct = total ? 100 - productPct : 0;
  const completeRate = total ? Math.round(done / total * 100) : 0;

  const subMap = {};
  ownItems.forEach(i => { subMap[i.sub] = (subMap[i.sub] || 0) + 1; });
  const subArr = Object.entries(subMap).sort((a, b) => b[1] - a[1]);

  const ownFiltered = ownFilter === 'all' ? ownItems : ownItems.filter(i => i.status === ownFilter);
  const otherFiltered = otherFilter === 'all' ? otherItems : otherItems.filter(i => i.status === otherFilter);

  const saveRework = async () => {
    const { recordId, itemId, solution, due_date, status, rework_note } = rework;
    const rec = records.find(r => r.id === recordId);
    if (!rec) return;
    const newItems = rec.items.map(it =>
      it.id === itemId ? { ...it, solution, due_date, status, rework_note: status === 'overdue' ? rework_note : it.rework_note } : it
    );
    await updateRecord(recordId, newItems);
    setRework(null);
    onReload();
  };

  const renderItemCard = (it, showAction, mode = 'own') => (
    <div key={it.id} className="border border-gray-200 rounded-lg p-4 bg-gray-50">
      <div className="flex items-center gap-2 mb-2 flex-wrap">
        <Badge text={it.category === 'product' ? '产品' : '服务'} cls={it.category === 'product' ? 'bg-blue-50 text-blue-700 border-blue-300' : 'bg-orange-50 text-orange-700 border-orange-300'} />
        <Badge text={it.sub} />
        <Badge text={STATUS_LABELS[it.status] || '待整改'} cls={STATUS_COLOR[it.status] || ''} />
        <span className="text-xs text-gray-400">{it._record.week_label} · {PERIOD_LABELS[it.period || it._record.period]} · {formatDateTime(it._record.created_at)} · {mode === 'own' ? '提交人' : '问题门店'} {mode === 'own' ? it._record.submitter_store : it._record.target_store}</span>
      </div>
      <p className="text-sm text-gray-700 leading-relaxed mb-1">{it.desc}</p>
      <ImageGallery images={it.images} className="mb-2" />
      {it.solution && <p className="text-xs text-emerald-600">方案：{it.solution}{it.due_date ? `（节点 ${it.due_date}）` : ''}</p>}
      {it.status === 'overdue' && it.rework_note && <p className="text-xs text-rose-600">重盘：{it.rework_note}</p>}
      {showAction && (
        <button onClick={() => setRework({ recordId: it._record.id, itemId: it.id, solution: it.solution, due_date: it.due_date, status: it.status, rework_note: it.rework_note, images: it.images })}
          className="mt-2 text-xs px-3 py-2 rounded-lg bg-indigo-50 text-indigo-700 border border-indigo-300 hover:bg-indigo-100 transition">复盘 / 跟进</button>
      )}
    </div>
  );

  return (
    <div className="max-w-5xl mx-auto px-4 py-6 fade-in">
      <h2 className="text-lg font-bold text-gray-900 mb-1">门店看板 · {currentStore}</h2>
      <p className="text-sm text-gray-500 mb-4">本门店被检查的历史记录、整改进度与类别分析。</p>

      <div className="grid grid-cols-2 md:grid-cols-4 gap-3 mb-5">
        <div className="bg-white border border-gray-200 rounded-xl p-4">
          <p className="text-xs text-gray-500 mb-1">总问题</p>
          <p className="text-2xl font-bold text-gray-900">{total}</p>
        </div>
        <div className="bg-white border border-gray-200 rounded-xl p-4">
          <p className="text-xs text-gray-500 mb-1">待整改</p>
          <p className="text-2xl font-bold text-amber-600">{pending}</p>
        </div>
        <div className="bg-white border border-gray-200 rounded-xl p-4">
          <p className="text-xs text-gray-500 mb-1">已完成</p>
          <p className="text-2xl font-bold text-emerald-600">{done}</p>
        </div>
        <div className="bg-white border border-gray-200 rounded-xl p-4">
          <p className="text-xs text-gray-500 mb-1">已超期</p>
          <p className="text-2xl font-bold text-rose-600">{overdue}</p>
        </div>
      </div>

      <div className="grid gap-3 md:grid-cols-2 mb-5">
        <div className="bg-white border border-gray-200 rounded-xl p-5">
          <h3 className="text-sm font-semibold text-gray-900 mb-4">类别占比</h3>
          <div className="flex items-center gap-4">
            <div className="w-20 h-20 rounded-full flex-shrink-0" style={{ background: `conic-gradient(#6366f1 0% ${productPct}%, #f59e0b ${productPct}% 100%)` }}></div>
            <div className="text-sm space-y-1.5">
              <div className="flex items-center gap-2"><span className="w-3 h-3 rounded-full bg-indigo-500"></span>产品 {productCnt}（{productPct}%）</div>
              <div className="flex items-center gap-2"><span className="w-3 h-3 rounded-full bg-amber-500"></span>服务 {serviceCnt}（{servicePct}%）</div>
            </div>
          </div>
        </div>
        <div className="bg-white border border-gray-200 rounded-xl p-5">
          <h3 className="text-sm font-semibold text-gray-900 mb-4">整改完成率</h3>
          <p className="text-3xl font-bold text-emerald-600">{completeRate}%</p>
          <p className="text-xs text-gray-500 mt-1">{done} 已完成 / {total} 总问题</p>
          <div className="mt-3 h-2 rounded-full bg-gray-100 overflow-hidden">
            <div className="h-full bg-emerald-500" style={{ width: completeRate + '%' }}></div>
          </div>
        </div>
      </div>

      <div className="bg-white border border-gray-200 rounded-xl p-5 mb-5">
        <h3 className="text-sm font-semibold text-gray-900 mb-3">子分类问题数</h3>
        {subArr.length === 0 ? <p className="text-sm text-gray-500">暂无数据</p> : (
          <div className="space-y-2">
            {subArr.map(([sub, cnt]) => {
              const max = subArr[0][1] || 1;
              return (
                <div key={sub} className="flex items-center gap-3">
                  <span className="text-xs text-gray-600 w-24 flex-shrink-0">{sub}</span>
                  <div className="flex-1 h-3 rounded-full bg-gray-100 overflow-hidden">
                    <div className="h-full bg-indigo-500" style={{ width: Math.round(cnt / max * 100) + '%' }}></div>
                  </div>
                  <span className="text-xs text-gray-600 w-6 text-right">{cnt}</span>
                </div>
              );
            })}
          </div>
        )}
      </div>

      <div className="grid gap-4 md:grid-cols-2">
        <div className="bg-white border border-gray-200 rounded-xl p-5">
          <div className="flex items-center justify-between mb-3 flex-wrap gap-2">
            <h3 className="text-sm font-semibold text-gray-900">本门店问题</h3>
            <div className="flex gap-2">
              {[{ k: 'all', t: '全部' }, { k: 'pending', t: '待整改' }, { k: 'overdue', t: '已超期' }].map(f => (
                <button key={f.k} onClick={() => setOwnFilter(f.k)}
                  className={`px-3 py-1 rounded-lg text-xs font-medium border transition ${ownFilter === f.k ? 'bg-indigo-50 text-indigo-700 border-indigo-300' : 'text-gray-600 border-gray-300 hover:bg-gray-100'}`}>{f.t}</button>
              ))}
            </div>
          </div>
          {ownFiltered.length === 0 ? <p className="text-sm text-gray-500 py-6 text-center">暂无记录</p> : (
            <div className="space-y-3">{ownFiltered.map(it => renderItemCard(it, true, 'own'))}</div>
          )}
        </div>

        <div className="bg-white border border-gray-200 rounded-xl p-5">
          <div className="flex items-center justify-between mb-3 flex-wrap gap-2">
            <h3 className="text-sm font-semibold text-gray-900">其他门店问题</h3>
            <div className="flex gap-2">
              {[{ k: 'all', t: '全部' }, { k: 'pending', t: '待整改' }, { k: 'overdue', t: '已超期' }].map(f => (
                <button key={f.k} onClick={() => setOtherFilter(f.k)}
                  className={`px-3 py-1 rounded-lg text-xs font-medium border transition ${otherFilter === f.k ? 'bg-indigo-50 text-indigo-700 border-indigo-300' : 'text-gray-600 border-gray-300 hover:bg-gray-100'}`}>{f.t}</button>
              ))}
            </div>
          </div>
          {otherFiltered.length === 0 ? <p className="text-sm text-gray-500 py-6 text-center">暂无记录</p> : (
            <div className="space-y-3">{otherFiltered.map(it => renderItemCard(it, false, 'other'))}</div>
          )}
        </div>
      </div>

      <Modal open={!!rework} onClose={() => setRework(null)} title="复盘跟进">
        {rework && (
          <div className="space-y-3">
            {rework.images && rework.images.length > 0 && (
              <div>
                <label className="block text-xs text-gray-500 mb-1">问题图片</label>
                <ImageGallery images={rework.images} />
              </div>
            )}
            <div>
              <label className="block text-xs text-gray-500 mb-1">整改状态</label>
              <select value={rework.status} onChange={e => setRework({ ...rework, status: e.target.value })}
                className="w-full bg-gray-50 border border-gray-300 rounded-lg px-3 py-2 text-gray-900 outline-none">
                <option value="pending">待整改</option>
                <option value="done">已完成</option>
                <option value="overdue">已超期（需重新复盘）</option>

            </div>
            <div>

              <textarea value={rework.solution} onChange={e => setRework({ ...rework, solution: e.target.value })} rows={3}
                placeholder="针对这个问题怎么改"
                className="w-full bg-gray-50 border border-gray-300 rounded-lg px-3 py-2 text-sm text-gray-900 placeholder-gray-400 outline-none resize-none" />
            </div>
            <div>
              <label className="block text-xs text-gray-500 mb-1">整改时间节点</label>
              <input type="date" value={rework.due_date} onChange={e => setRework({ ...rework, due_date: e.target.value })}
                className="w-full bg-gray-50 border border-gray-300 rounded-lg px-3 py-2 text-sm text-gray-900 outline-none" />
            </div>
            {rework.status === 'overdue' && (
              <div>
                <label className="block text-xs text-gray-500 mb-1">重新复盘说明（为何未达成）</label>
                <textarea value={rework.rework_note} onChange={e => setRework({ ...rework, rework_note: e.target.value })} rows={2}
                  className="w-full bg-gray-50 border border-gray-300 rounded-lg px-3 py-2 text-sm text-gray-900 placeholder-gray-400 outline-none resize-none" />
              </div>
            )}
            <div className="flex gap-2 pt-1">
              <button onClick={() => setRework(null)} className="flex-1 py-2 rounded-lg text-sm text-gray-600 hover:text-gray-900 hover:bg-gray-100 transition">取消</button>
              <button onClick={saveRework} className="flex-1 py-2 rounded-lg text-sm font-medium bg-indigo-600 hover:bg-indigo-500 text-white transition">保存</button>
            </div>
          </div>
        )}
      </Modal>
    </div>
  );
}

/* ============ 主应用 ============ */
function App() {
  const [store, setStore] = useState(() => localStorage.getItem(STORE_KEY) || '');
  const [view, setView] = useState('submit');
  const [records, setRecords] = useState([]);
  const [syncStatus, setSyncStatus] = useState('connecting');
  const [dashAuth, setDashAuth] = useState(false);
  const [showPwd, setShowPwd] = useState(false);
  const [pwd, setPwd] = useState('');
  const [pwdErr, setPwdErr] = useState('');
  const [localOnly, setLocalOnly] = useState(0);
  const [migrating, setMigrating] = useState(false);

  const logout = () => { localStorage.removeItem(STORE_KEY); setStore(''); };
  const { show: closing, cancel: cancelClose } = useAutoClose(logout);

  const openDashboard = () => {
    if (dashAuth) { setView('dashboard'); return; }
    setPwd(''); setPwdErr(''); setShowPwd(true);
  };
  const submitPwd = () => {
    if (pwd === DASH_PWD) { setDashAuth(true); setShowPwd(false); setView('dashboard'); }
    else { setPwdErr('密码错误'); }
  };

  const refresh = useCallback(async () => {
    setSyncStatus('connecting');
    const data = await loadRecords();
    // 本机遗留记录（id 不是 uuid 的）：自动同步到云端，按钮仅作手动兜底
    const localOnlyRecs = data.filter(r => !/^[0-9a-fA-F-]{36}$/.test(r.id || ''));
    if (localOnlyRecs.length > 0) {
      const n = await migrateLocalToCloud();
      if (n > 0) {
        const data2 = await loadRecords(); // 重新拉云端，数据已统一
        setRecords(data2);
        setLocalOnly(0);
        setSyncStatus('connected');
        return;
      }
    }
    setRecords(data);
    setLocalOnly(localOnlyRecs.length);
    setSyncStatus('connected');
  }, []);

  const doMigrate = async () => {
    setMigrating(true);
    const n = await migrateLocalToCloud();
    await refresh();
    setMigrating(false);
    if (n > 0) alert(`已同步 ${n} 条记录到云端，手机/其他设备现在也能看到了。`);
    else alert('没有需要同步的本地记录。');
  };

  useEffect(() => {
    if (!store) return;
    refresh();
    let channel = null;
    try {
      channel = supabase.channel('mirror-changes')
        .on('postgres_changes', { event: '*', schema: 'public', table: TABLE }, () => refresh())
        .subscribe();
    } catch (e) {}
    const poll = setInterval(() => { if (document.visibilityState === 'visible') refresh(); }, 12000);
    return () => { if (channel) supabase.removeChannel(channel).catch(() => {}); clearInterval(poll); };
  }, [store, refresh]);

  if (!store) return <LoginScreen onLogin={s => { localStorage.setItem(STORE_KEY, s); setStore(s); }} />;

  return (
    <div className="min-h-screen">
      <header className="sticky top-0 z-40 bg-white/80 backdrop-blur-lg border-b border-gray-200">
        <div className="flex flex-wrap items-center justify-between gap-y-2 px-4 py-2 min-h-[60px] h-auto max-w-5xl mx-auto">
          <div className="flex items-center gap-2.5">
            <div className="w-8 h-8 rounded-lg bg-gradient-to-br from-indigo-500 to-indigo-600 flex items-center justify-center text-white">🔍</div>
            <div>
              <h1 className="text-sm font-bold text-gray-900 leading-tight">{store}</h1>
              <p className="text-xs text-gray-500 leading-tight">
                镜检行动
                <span className="ml-1">{syncStatus === 'connected' ? '· 已同步' : '· 连接中'}</span>
              </p>
            </div>
          </div>
          <nav className="flex items-center gap-1 flex-wrap justify-end">
            <button onClick={() => setView('submit')}
              className={`px-2 py-1.5 sm:px-3 sm:py-2 rounded-lg text-xs sm:text-sm font-medium transition ${view === 'submit' ? 'bg-indigo-600/20 text-indigo-600 border border-indigo-500/30' : 'text-gray-600 hover:text-gray-900 hover:bg-gray-100'}`}>提交镜检</button>
            <button onClick={() => setView('store')}
              className={`px-2 py-1.5 sm:px-3 sm:py-2 rounded-lg text-xs sm:text-sm font-medium transition ${view === 'store' ? 'bg-indigo-600/20 text-indigo-600 border border-indigo-500/30' : 'text-gray-600 hover:text-gray-900 hover:bg-gray-100'}`}>门店看板</button>
            <button onClick={openDashboard}
              className={`px-2 py-1.5 sm:px-3 sm:py-2 rounded-lg text-xs sm:text-sm font-medium transition ${view === 'dashboard' ? 'bg-indigo-600/20 text-indigo-600 border border-indigo-500/30' : 'text-gray-600 hover:text-gray-900 hover:bg-gray-100'}`}>管理看板</button>
            <button onClick={logout} className="ml-1 px-2 py-1.5 sm:px-3 sm:py-2 rounded-lg text-xs sm:text-sm text-gray-500 hover:text-gray-900 hover:bg-gray-100 transition">退出</button>
          </nav>
        </div>
      </header>

      {localOnly > 0 && (
        <div className="max-w-5xl mx-auto px-4 mt-4">
          <div className="flex items-center gap-3 flex-wrap bg-amber-50 border border-amber-300 rounded-xl px-4 py-3">
            <span className="text-sm text-amber-800">检测到 {localOnly} 条本机记录，正在自动同步到云端（同步后手机/其他设备可见）；若迟迟未同步可手动点击。</span>
            <button onClick={doMigrate} disabled={migrating}
              className="px-3 py-1.5 rounded-lg text-sm font-medium bg-amber-500 hover:bg-amber-400 text-white transition disabled:opacity-50">
              {migrating ? '同步中…' : '手动同步'}
            </button>
          </div>
        </div>
      )}

      {view === 'submit'
        ? <SubmitView currentStore={store} onSubmitted={() => { refresh(); setView('dashboard'); }} />
        : view === 'store'
        ? <StoreDashboardView records={records} currentStore={store} onReload={refresh} />
        : <DashboardView records={records} currentStore={store} onReload={refresh} />}

      <Modal open={showPwd} onClose={() => setShowPwd(false)} title="管理看板密码">
        <div className="space-y-3">
          <p className="text-sm text-gray-500">请输入管理看板密码（415）以查看全部门店数据。</p>
          <input type="password" value={pwd} onChange={e => setPwd(e.target.value)} onKeyDown={e => e.key === 'Enter' && submitPwd()}
            placeholder="请输入密码"
            className="w-full bg-gray-50 border border-gray-300 rounded-lg px-3 py-2 text-sm text-gray-900 outline-none focus:border-indigo-500" />
          {pwdErr && <p className="text-rose-400 text-sm">{pwdErr}</p>}
          <button onClick={submitPwd}
            className="w-full py-2.5 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white font-medium transition">进入</button>
        </div>
      </Modal>

      {closing && (
        <div className="fixed inset-0 z-[60] flex items-center justify-center bg-black/70 backdrop-blur-sm">
          <div className="bg-white border border-gray-300 rounded-2xl p-8 text-center max-w-sm fade-in">
            <h3 className="text-lg font-bold text-gray-900 mb-2">页面即将自动关闭</h3>
            <p className="text-sm text-gray-600 mb-4">已连续 3 分钟没有操作，10 秒后关闭</p>
            <p className="text-xs text-gray-600">动一下鼠标或按任意键即可继续使用</p>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
