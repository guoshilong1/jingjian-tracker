/* ============ 工具函数 ============ */
function isoWeek(date) {
  const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
  const dayNum = (d.getUTCDay() + 6) % 7;
  d.setUTCDate(d.getUTCDate() - dayNum + 3);
  const firstThursday = new Date(Date.UTC(d.getUTCFullYear(), 0, 4));
  const week = 1 + Math.round(((d - firstThursday) / 86400000 - 3 + ((firstThursday.getUTCDay() + 6) % 7)) / 7);
  return d.getUTCFullYear() + '-W' + String(week).padStart(2, '0');
}
function uid() { return 'm_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8); }
function todayStr() {
  const d = new Date(); const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
}

function formatDateTime(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  const p = n => String(n).padStart(2, '0');
  return `${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

/* ============ 数据层（Supabase 优先，localStorage 兜底） ============ */
function loadLocal() {
  try {
    if (typeof window === 'undefined' || !window.localStorage) return [];
    return JSON.parse(localStorage.getItem(LOCAL_KEY) || '[]');
  } catch (e) {
    console.warn('[loadLocal] localStorage 不可用', e.message);
    return [];
  }
}
function saveLocal(arr) {
  try {
    if (typeof window === 'undefined' || !window.localStorage) return;
    localStorage.setItem(LOCAL_KEY, JSON.stringify(arr));
  } catch (e) {
    console.warn('[saveLocal] localStorage 写入失败', e.message);
  }
}

async function loadRecords() {
  let local = [];
  try { local = loadLocal(); } catch (e) {}
  try {
    const { data, error } = await supabase.from(TABLE).select('*').order('created_at', { ascending: false });
    if (error) throw error;
    const cloud = data || [];
    // 合并本地兜底（离线时写入的）与云端记录，避免提交后“消失”
    const cloudIds = new Set(cloud.map(r => r.id));
    const merged = [...cloud, ...local.filter(r => !cloudIds.has(r.id))];
    return { data: merged.sort((a, b) => new Date(b.created_at) - new Date(a.created_at)), source: 'cloud' };
  } catch (e) {
    console.warn('[load] 云端失败，用本地兜底', e.message);
    return { data: local, source: 'local' };
  }
}
async function insertRecord(rec) {
  // Supabase 表 id 是 uuid，不能传自定义字符串；让数据库自生成
  const payload = { ...rec };
  delete payload.id;
  try {
    const { data, error } = await supabase.from(TABLE).insert(payload).select();
    if (error) throw error;
    return data && data[0] ? data[0] : rec;
  } catch (e) {
    console.warn('[insert] 云端失败，写本地', e.message);
    const local = loadLocal(); local.push(rec); saveLocal(local); return rec;
  }
}
async function updateRecord(id, items) {
  // 注意：updated_at 是 timestamptz，必须传 ISO 字符串，不能用 Date.now() 数字（会 400 报错）
  const ts = new Date().toISOString();
  try {
    const { error } = await supabase.from(TABLE).update({ items, updated_at: ts }).eq('id', id);
    if (error) throw error;
    return true;
  } catch (e) {
    console.warn('[update] 云端失败，写本地', e.message);
    const local = loadLocal().map(r => r.id === id ? { ...r, items, updated_at: ts } : r);
    saveLocal(local); return false;
  }
}

async function deleteRecord(id) {
  try {
    const { error } = await supabase.from(TABLE).delete().eq('id', id);
    if (error) throw error;
    return true;
  } catch (e) {
    console.warn('[delete] 云端失败，清本地', e.message);
    return false;
  } finally {
    const local = loadLocal().filter(r => r.id !== id);
    saveLocal(local);
  }
}

// 把仅存于本机浏览器（localStorage）的记录迁移到 Supabase 云端，便于手机/其他设备查看
async function migrateLocalToCloud() {
  const local = loadLocal();
  if (!local.length) return 0;
  let ok = 0;
  for (const rec of local) {
    const payload = { ...rec };
    delete payload.id; // 让 Supabase 生成 uuid，避免与云端冲突
    try {
      const { error } = await supabase.from(TABLE).insert(payload);
      if (error) throw error;
      ok++;
    } catch (e) {
      console.warn('[migrate] 单条失败', e.message);
    }
  }
  saveLocal([]); // 迁移完成后清空本地兜底
  return ok;
}

/* ============ 防摸鱼：3 分钟无操作关闭 ============ */
function useAutoClose(onClose) {
  const [show, setShow] = useState(false);
  const timer = useRef(null);
  const closeTimer = useRef(null);
  const reset = useCallback(() => {
    setShow(false);
    if (closeTimer.current) clearTimeout(closeTimer.current);
    if (timer.current) clearTimeout(timer.current);
    timer.current = setTimeout(() => {
      setShow(true);
      closeTimer.current = setTimeout(() => onClose(), 10000);
    }, 180000);
  }, [onClose]);
  useEffect(() => {
    const acts = ['mousemove', 'mousedown', 'keydown', 'touchstart', 'scroll'];
    acts.forEach(a => window.addEventListener(a, reset, { passive: true }));
    reset();
    return () => {
      acts.forEach(a => window.removeEventListener(a, reset));
      if (timer.current) clearTimeout(timer.current);
      if (closeTimer.current) clearTimeout(closeTimer.current);
    };
  }, [reset]);
  return { show, cancel: reset };
}

function emptyItem() { return { id: uid(), period: 'weekday', category: 'issue', sub: ISSUE_CATEGORIES[0], desc: '', images: [], solution: '', due_date: '', status: 'pending', rework_note: '', rework_images: [], tracker_store: '', track_result: '', track_note: '', track_at: '', track_images: [] }; }

function compressImage(file, maxDim = 800, quality = 0.72) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const reader = new FileReader();
    reader.onload = e => {
      img.onload = () => {
        let w = img.width, h = img.height;
        if (w > h && w > maxDim) { h = Math.round(h * maxDim / w); w = maxDim; }
        else if (h > maxDim) { w = Math.round(w * maxDim / h); h = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, w, h);
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

  const setItem = (i, patch) => setItems(prev => prev.map((it, idx) => idx === i ? { ...it, ...patch } : it));
  const addItem = () => setItems(prev => prev.length < 3 ? [...prev, { ...emptyItem(), period: prev[prev.length - 1]?.period || 'weekday' }] : prev);

      updated_at: new Date().toISOString(),

      await insertRecord(rec);

                      onChange={async e => {
                        const files = Array.from(e.target.files || []);
                        const remaining = 3 - (it.images || []).length;
                        const toAdd = files.slice(0, remaining);
                        const compressed = await Promise.all(toAdd.map(f => compressImage(f).catch(() => null)));
                        const added = compressed.filter(Boolean);
                        setItem(i, { images: [...(it.images || []), ...added] });
                        e.target.value = '';
                      }} />
                  </label>
                )}
              </div>
            </div>
          ))}
        </div>

        {items.length < 3 && (
          <button onClick={addItem} className="mt-3 w-full py-2 rounded-lg border border-dashed border-gray-300 text-sm text-gray-600 hover:border-indigo-500 hover:text-indigo-600 transition">+ 再加一个问题（最多 3 个）</button>
        )}
      </div>

      {err && <p className="text-rose-400 text-sm mb-3">{err}</p>}
      <button onClick={submit} disabled={saving}
        className="w-full py-2.5 rounded-lg bg-indigo-600 hover:bg-indigo-500 disabled:opacity-50 text-white font-medium transition">
        {saving ? '提交中…' : '提交镜检'}
      </button>
    </div>
  );
}

/* ============ 管理看板 ============ */
function DashboardView({ records, currentStore, onReload }) {
  const [storeFilter, setStoreFilter] = useState('all');
  const [periodFilter, setPeriodFilter] = useState('all');
  const [statusFilter, setStatusFilter] = useState('all');
  const [rework, setRework] = useState(null);
  const [deleting, setDeleting] = useState(null); // { recordId, itemId, desc }
  const [dashTab, setDashTab] = useState('problems'); // problems | submit | exec
  const [execRows, setExecRows] = useState([]);
  const [execLoading, setExecLoading] = useState(false);
  const [execRunning, setExecRunning] = useState(false);
  const [execMsg, setExecMsg] = useState('');

  const allItems = useMemo(() => {
    const out = [];
    records.forEach(r => (r.items || []).forEach(it => out.push({ ...it, _record: r })));
    return out;
  }, [records]);

  const filtered = allItems.filter(it => {
    if (storeFilter !== 'all' && it._record.target_store !== storeFilter) return false;
    const itemPeriod = it.period || it._record.period;
    if (periodFilter !== 'all' && itemPeriod !== periodFilter) return false;
    if (statusFilter !== 'all' && it.status !== statusFilter) return false;
    return true;
  });

  const grouped = useMemo(() => {
    const m = {};
    filtered.forEach(it => {
      const k = it._record.target_store;
      (m[k] = m[k] || []).push(it);
    });
    return m;
  }, [filtered]);

  const canEdit = (rec) => rec.target_store === currentStore;

  // —— 执行力记录（未提报扣分 / 未复盘扣分，每条独立不合并）——
  const weekStartOf = (d) => { const x = new Date(d); const day = (x.getDay() + 6) % 7; x.setDate(x.getDate() - day); x.setHours(0, 0, 0, 0); return x; };
  const thisWeekStart = () => weekStartOf(new Date());
  const lastWeekStart = () => { const s = weekStartOf(new Date()); s.setDate(s.getDate() - 7); return s; };
  const dayStr = (d) => { const p = n => String(n).padStart(2, '0'); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`; };

  // 本周未提报门店（提交人 submitter_store 在本周内有记录即算已提报）
  const unreportedThisWeekStores = useMemo(() => {
    const ws = thisWeekStart();
    const reported = new Set();
    records.forEach(r => { if (new Date(r.created_at) >= ws && STORE_LIST.includes(r.submitter_store)) reported.add(r.submitter_store); });
    return STORE_LIST.filter(s => !reported.has(s));
  }, [records]);
  // 上周「本店为被检查门店」的问题全部仍为待整改（pending）的门店 → 未复盘追踪
  const untrackedLastWeekStores = useMemo(() => {
    const lw = lastWeekStart(); const lwe = new Date(lw.getTime() + 7 * 86400000);
    const hasAny = {}, hasTracked = {};
    records.forEach(r => {
      const rt = new Date(r.created_at);
      if (rt < lw || rt >= lwe) return;
      (r.items || []).forEach(it => { const s = r.target_store; hasAny[s] = true; if (it.status && it.status !== 'pending') hasTracked[s] = true; });
    });
    return STORE_LIST.filter(s => hasAny[s] && !hasTracked[s]);
  }, [records]);

  const loadExecRows = useCallback(async () => {
    setExecLoading(true);
    try {
      const { data, error } = await supabase.from('execution_deductions').select('*').order('deduct_date', { ascending: false });
      if (error) throw error;
      setExecRows(data || []);
    } catch (e) { console.warn('[exec] 加载失败', e.message); }
    setExecLoading(false);
  }, []);
  useEffect(() => { loadExecRows(); }, [loadExecRows]);

  // 手动/自动执行扣分：type = submit(未提报) | track(未复盘)
  const runDeduct = useCallback(async (type) => {
    setExecRunning(true); setExecMsg('');
    try {
      const stores = type === 'submit' ? unreportedThisWeekStores : untrackedLastWeekStores;
      const weekStart = dayStr(type === 'submit' ? thisWeekStart() : lastWeekStart());
      const reason = type === 'submit' ? '本周未提交镜检（自动扣分）' : '上周问题未复盘追踪（自动扣分）';
      if (stores.length === 0) { setExecMsg('无需扣分：所有门店均已达标。'); setExecRunning(false); return; }
      // 幂等：同一周期同一类型已记录的门店不再重复扣
      const { data: existing } = await supabase.from('execution_deductions').select('store').eq('deduct_type', type).eq('week_start', weekStart);
      const done = new Set((existing || []).map(x => x.store));
      const toInsert = stores.filter(s => !done.has(s)).map(s => ({ store: s, deduct_type: type, week_start: weekStart, deduct_date: new Date().toISOString(), reason, value: -1 }));
      if (toInsert.length === 0) { setExecMsg('该周期此类型扣分已执行过，无需重复。'); setExecRunning(false); return; }
      const { error } = await supabase.from('execution_deductions').insert(toInsert);
      if (error) throw error;
      setExecMsg(`已对 ${toInsert.length} 家门店执行${type === 'submit' ? '未提报' : '未复盘'}扣分（-1/店）。`);
      await loadExecRows();
    } catch (e) { setExecMsg('执行失败：' + e.message); }
    setExecRunning(false);
  }, [unreportedThisWeekStores, untrackedLastWeekStores, loadExecRows]);

  // 各门店当前执行力得分（初始 0，可负，逐条累加）
  const execScoreMap = useMemo(() => {
    const m = {}; STORE_LIST.forEach(s => m[s] = 0);
    execRows.forEach(r => { if (m[r.store] !== undefined) m[r.store] += (r.value || 0); });
    return m;
  }, [execRows]);

  // —— 管理看板增强统计（闭环率 / 本周动态 / 图表用）——
  const total = allItems.length;
  const verified = allItems.filter(i => i.status === 'verified').length;
  const completeRate = total ? Math.round(verified / total * 100) : 0;
  const weekStart = (() => { const d = new Date(); const day = (d.getDay() + 6) % 7; d.setDate(d.getDate() - day); d.setHours(0, 0, 0, 0); return d; })();
  const isThisWeek = (iso) => { const t = new Date(iso); return t >= weekStart; };
  const newThisWeek = allItems.filter(i => isThisWeek(i._record.created_at)).length;
  const closedThisWeek = allItems.filter(i => i.status === 'verified' && isThisWeek(i._record.updated_at || i._record.created_at)).length;
  const subCountMap = {};
  allItems.forEach(i => { subCountMap[i.sub] = (subCountMap[i.sub] || 0) + 1; });
  const subArr = Object.entries(subCountMap).sort((a, b) => b[1] - a[1]);
  const subColors = ['#3b82f6', '#f97316', '#10b981', '#8b5cf6', '#f59e0b', '#ec4899', '#06b6d4', '#84cc16'];
  const subSlices = subArr.slice(0, 5).map(([sub, cnt], i) => ({ sub, cnt, pct: Math.round(cnt / total * 100), color: subColors[i % subColors.length] }));

  const storeCountMap = {};
  allItems.forEach(i => { const k = i._record.target_store; storeCountMap[k] = (storeCountMap[k] || 0) + 1; });
  const topStores = Object.entries(storeCountMap).sort((a, b) => b[1] - a[1]);
  const storeMax = topStores.length ? topStores[0][1] : 1;

  const saveRework = async () => {
    const { recordId, itemId, solution, due_date, status, rework_note, rework_images } = rework;
    const rec = records.find(r => r.id === recordId);
    if (!rec) return;
    const newItems = rec.items.map(it =>
      it.id === itemId ? { ...it, solution, due_date, status, rework_images, rework_note: status === 'overdue' ? rework_note : it.rework_note } : it
    );
    await updateRecord(recordId, newItems);
    setRework(null);
    onReload();
  };

  const handleDelete = async ({ recordId, itemId }) => {
    const rec = records.find(r => r.id === recordId);
    if (!rec) return;
    const newItems = rec.items.filter(it => it.id !== itemId);
    if (newItems.length === 0) {
      await deleteRecord(recordId);
    } else {
      await updateRecord(recordId, newItems);
    }
    setDeleting(null);
    onReload();
  };

  return (
    <div className="max-w-5xl mx-auto px-4 py-6 fade-in">
      <h2 className="text-lg font-bold text-gray-900 mb-1">管理看板 · 按门店汇总</h2>
      <p className="text-sm text-gray-500 mb-4">后台按被检查门店分类，可填解决方案与整改节点做复盘。</p>

      <div className="flex gap-2 mb-5">
        <button onClick={() => setDashTab('problems')}
          className={`px-3 py-1.5 rounded-lg text-xs sm:text-sm font-medium transition ${dashTab === 'problems' ? 'bg-indigo-600 text-white shadow-sm' : 'bg-white border border-gray-300 text-gray-600 hover:text-gray-900 hover:bg-gray-50'}`}>问题汇总</button>
        <button onClick={() => setDashTab('submit')}
          className={`px-3 py-1.5 rounded-lg text-xs sm:text-sm font-medium transition ${dashTab === 'submit' ? 'bg-indigo-600 text-white shadow-sm' : 'bg-white border border-gray-300 text-gray-600 hover:text-gray-900 hover:bg-gray-50'}`}>提报看板</button>
        <button onClick={() => setDashTab('exec')}
          className={`px-3 py-1.5 rounded-lg text-xs sm:text-sm font-medium transition ${dashTab === 'exec' ? 'bg-indigo-600 text-white shadow-sm' : 'bg-white border border-gray-300 text-gray-600 hover:text-gray-900 hover:bg-gray-50'}`}>执行力记录</button>
      </div>

      {dashTab === 'problems' && (<div className="fade-in">
      <div className="grid grid-cols-2 md:grid-cols-5 gap-3 mb-5">
        <div className="bg-white border border-gray-200 rounded-xl p-4"><p className="text-xs text-gray-500 mb-1">总问题</p><p className="text-2xl font-bold text-gray-900">{allItems.length}</p></div>
        <div className="bg-white border border-gray-200 rounded-xl p-4"><p className="text-xs text-gray-500 mb-1">待整改</p><p className="text-2xl font-bold text-amber-600">{allItems.filter(i => i.status === 'pending').length}</p></div>
        <div className="bg-white border border-gray-200 rounded-xl p-4"><p className="text-xs text-gray-500 mb-1">待验收</p><p className="text-2xl font-bold text-sky-600">{allItems.filter(i => i.status === 'done').length}</p></div>
        <div className="bg-white border border-gray-200 rounded-xl p-4"><p className="text-xs text-gray-500 mb-1">已验收</p><p className="text-2xl font-bold text-emerald-600">{allItems.filter(i => i.status === 'verified').length}</p></div>
        <div className="bg-white border border-gray-200 rounded-xl p-4"><p className="text-xs text-gray-500 mb-1">已超期</p><p className="text-2xl font-bold text-rose-600">{allItems.filter(i => i.status === 'overdue').length}</p></div>
      </div>

      {/* 管理感卡片：验收闭环率 + 本周动态 */}
      <div className="grid grid-cols-1 md:grid-cols-3 gap-3 mb-5">
        <div className="bg-white border border-gray-200 rounded-xl p-4 flex items-center gap-4">
          <div className="relative w-16 h-16 shrink-0 rounded-full" style={{ background: `conic-gradient(#10b981 ${completeRate}%, #e5e7eb ${completeRate}%)` }}>
            <div className="absolute inset-2 bg-white rounded-full flex items-center justify-center"><span className="text-sm font-bold text-emerald-600">{completeRate}%</span></div>
          </div>
          <div>
            <p className="text-xs text-gray-500 mb-1">验收闭环率</p>
            <p className="text-xs text-gray-400">{verified} 已验收 / {total} 总问题</p>
          </div>
        </div>
        <div className="bg-white border border-gray-200 rounded-xl p-4">
          <p className="text-xs text-gray-500 mb-1">本周新增</p>
          <p className="text-2xl font-bold text-indigo-600">{newThisWeek}</p>
          <p className="text-xs text-gray-400 mt-1">本周（周一至今）新提交</p>
        </div>
        <div className="bg-white border border-gray-200 rounded-xl p-4">
          <p className="text-xs text-gray-500 mb-1">本周闭环</p>
          <p className="text-2xl font-bold text-sky-600">{closedThisWeek}</p>
          <p className="text-xs text-gray-400 mt-1">本周完成验收的问题</p>
        </div>
      </div>

      {/* 图表：问题类别占比 + 门店问题 TOP */}
      <div className="grid grid-cols-1 md:grid-cols-2 gap-3 mb-5">
        <div className="bg-white border border-gray-200 rounded-xl p-4">
          <p className="text-sm font-semibold text-gray-900 mb-3">问题类别 TOP5</p>
          {total === 0 ? <p className="text-xs text-gray-400">暂无数据</p> : (
            <div className="space-y-2.5">
              {subSlices.map(s => (
                <div key={s.sub}>
                  <div className="flex justify-between text-xs mb-1">
                    <span className="text-gray-700 truncate max-w-[8rem]" title={s.sub}>{s.sub}</span>
                    <span className="text-gray-500">{s.cnt}（{s.pct}%）</span>
                  </div>
                  <div className="bg-gray-100 rounded-full h-2.5 overflow-hidden">
                    <div className="h-2.5 rounded-full" style={{ width: `${s.pct}%`, background: s.color }}></div>
                  </div>
                </div>
              ))}
              {subArr.length > 5 && <div className="text-xs text-gray-400">另有 {subArr.length - 5} 项类别未显示</div>}
            </div>
          )}
        </div>
        <div className="bg-white border border-gray-200 rounded-xl p-4">
          <p className="text-sm font-semibold text-gray-900 mb-3">门店问题数 TOP</p>

            <div className="space-y-2">
              {topStores.map(([s, c]) => (
                <div key={s} className="flex items-center gap-2 text-sm">

                  <div className="flex-1 bg-gray-100 rounded-full h-3 overflow-hidden">
                    <div className="h-3 rounded-full bg-indigo-500" style={{ width: `${Math.round(c / storeMax * 100)}%` }}></div>
                  </div>
                  <span className="w-6 text-right text-gray-600">{c}</span>
                </div>
              ))}
            </div>
          )}
        </div>
      </div>

      <div className="flex flex-wrap gap-3 mb-5">
        <select value={storeFilter} onChange={e => setStoreFilter(e.target.value)}
          className="bg-gray-50 border border-gray-300 rounded-lg px-2 py-1.5 text-sm text-gray-900 outline-none">
          <option value="all">全部门店</option>
          {STORE_LIST.map(s => <option key={s} value={s}>{s}</option>)}

              return (<>
                <Badge text={`${sTotal} 项`} />
                <Badge text={`待整改 ${sPending}`} cls="bg-amber-100 text-amber-700 border-amber-300" />
                <Badge text={`闭环率 ${sRate}%`} cls="bg-emerald-100 text-emerald-700 border-emerald-300" />
              </>);
            })()}
            {store === currentStore && <Badge text="本店可复盘" cls="bg-indigo-600 text-white border-indigo-600" />}
          </div>
          <div className="grid gap-3 md:grid-cols-2">
            {grouped[store].map(it => (
              <div key={it.id} className={`bg-white border border-gray-200 rounded-xl p-4 ${it.status === 'verified' ? 'border-l-4 border-l-emerald-400' : it.status === 'done' ? 'border-l-4 border-l-sky-400' : (it.status === 'partial' || it.status === 'overdue') ? 'border-l-4 border-l-rose-400' : ''}`}>
                <div className="flex items-start justify-between gap-2 mb-2">
                  <div className="flex items-center gap-2 flex-wrap">
                    <Badge text={it.sub} cls="bg-indigo-50 text-indigo-700 border-indigo-300" />
                    <Badge text={STATUS_LABELS[it.status] || '待整改'} cls={STATUS_COLOR[it.status] || ''} />
                  </div>
                  <button onClick={() => setDeleting({ recordId: it._record.id, itemId: it.id, desc: it.desc })}

                    title="删除问题">删除</button>

          {(() => {

                    return (

                    <div key={idx} className="relative w-16 h-16 rounded-lg border border-gray-200 overflow-hidden bg-gray-100">

                      <button onClick={() => setRework({ ...rework, rework_images: rework.rework_images.filter((_, j) => j !== idx) })}

              )}
              {(rework.rework_images || []).length < 3 && (
                <label className="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg border border-dashed border-gray-300 text-xs text-gray-600 hover:border-indigo-500 hover:text-indigo-600 cursor-pointer transition">
                  <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="1.5" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5M12 3v13.5m0 0 4.5-4.5m-4.5 4.5L7.5 12" /></svg>
                  上传整改照片
                  <input type="file" accept="image/*" multiple className="hidden"
                    onChange={async e => {
                      const files = Array.from(e.target.files || []);
                      const remaining = 3 - (rework.rework_images || []).length;
                      const toAdd = files.slice(0, remaining);

                      const added = compressed.filter(Boolean);
                      setRework({ ...rework, rework_images: [...(rework.rework_images || []), ...added] });
                      e.target.value = '';
                    }} />

              )}
            </div>
            <div>
              <label className="block text-xs text-gray-500 mb-1">整改时间节点</label>
              <input type="date" value={rework.due_date} onChange={e => setRework({ ...rework, due_date: e.target.value })}
                className="w-full bg-gray-50 border border-gray-300 rounded-lg px-3 py-2 text-sm text-gray-900 outline-none" />
            </div>
            {rework.status === 'overdue' && (
              <div>

                <textarea value={rework.rework_note} onChange={e => setRework({ ...rework, rework_note: e.target.value })} rows={2}
                  className="w-full bg-gray-50 border border-gray-300 rounded-lg px-3 py-2 text-sm text-gray-900 placeholder-gray-400 outline-none resize-none" />

              <button onClick={saveRework} className="flex-1 py-2 rounded-lg text-sm font-medium bg-indigo-600 hover:bg-indigo-500 text-white transition">保存</button>

      <Modal open={!!deleting} onClose={() => setDeleting(null)} title="确认删除">
        {deleting && (

    </div>

}

/* ============ 月度看板（趋势分析） ============ */
function MonthlyView({ records, currentStore, onReload }) {
  const monthOptions = useMemo(() => {
    const arr = [];
    const now = new Date();
    for (let i = 0; i < 3; i++) {
      const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
      arr.push({ key: d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'), label: i === 0 ? '本月' : i === 1 ? '上月' : '上上月' });
    }
    return arr;
  }, []);
  const [month, setMonth] = useState(monthOptions[0].key);

  const TARGET_RATE = 80; // 月度闭环率目标线
  const [drill, setDrill] = useState(null); // 选中的门店，下钻看类别

  const allItems = useMemo(() => {
    const out = [];
    records.forEach(r => (r.items || []).forEach(it => out.push({ ...it, _record: r })));
    return out;
  }, [records]);

  const mk = (iso) => { const d = new Date(iso); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); };
  const inMonth = (iso, m) => mk(iso) === m;

  const monthItems = allItems.filter(i => inMonth(i._record.created_at, month));
  const total = monthItems.length;
  const verified = monthItems.filter(i => i.status === 'verified').length;
  const pending = monthItems.filter(i => i.status === 'pending').length;
  const done = monthItems.filter(i => i.status === 'done').length;
  const overdue = monthItems.filter(i => i.status === 'overdue').length;
  const rate = total ? Math.round(verified / total * 100) : 0;

  // 上月对比
  const [py, pm] = month.split('-').map(Number);
  const prevDate = new Date(py, pm - 2, 1);
  const prevKey = prevDate.getFullYear() + '-' + String(prevDate.getMonth() + 1).padStart(2, '0');
  const prevItems = allItems.filter(i => inMonth(i._record.created_at, prevKey));
  const prevTotal = prevItems.length;
  const prevVerified = prevItems.filter(i => i.status === 'verified').length;
  const prevRate = prevTotal ? Math.round(prevVerified / prevTotal * 100) : 0;
  const rateDelta = rate - prevRate;
  const newDelta = total - prevTotal; // 新增问题数环比

  // 周趋势（按 week_label 分组，垂直双柱：新增 / 该周问题已闭环）
  const weekMap = {};
  monthItems.forEach(i => {
    const w = i._record.week_label || '未知周';
    if (!weekMap[w]) weekMap[w] = { n: 0, c: 0 };
    weekMap[w].n += 1;
    if (i.status === 'verified') weekMap[w].c += 1;
  });
  const weeks = Object.keys(weekMap).sort();
  const weekMax = weeks.length ? Math.max(...weeks.map(w => weekMap[w].n)) : 1;

  // 时段（周内 / 周末）拆分
  const periodSplit = useMemo(() => {
    const wd = { total: 0, verified: 0, pending: 0 };
    const we = { total: 0, verified: 0, pending: 0 };
    monthItems.forEach(i => {
      const p = i.period || i._record.period;
      const t = p === 'weekend' ? we : wd;
      t.total += 1;
      if (i.status === 'verified') t.verified += 1;
      if (i.status === 'pending') t.pending += 1;
    });
    const rateOf = (o) => o.total ? Math.round(o.verified / o.total * 100) : 0;
    return { wd, we, wdRate: rateOf(wd), weRate: rateOf(we) };
  }, [monthItems]);

  // 门店月度统计（含逾期、平均闭环天数、类别明细）
  const storeMap = {};
  monthItems.forEach(i => {
    const k = i._record.target_store;
    if (!storeMap[k]) storeMap[k] = { total: 0, verified: 0, pending: 0, overdue: 0, closeDays: [], subs: {} };
    const m = storeMap[k];
    m.total += 1;
    if (i.status === 'verified') {
      m.verified += 1;
      const d0 = new Date(i._record.created_at).getTime();
      const d1 = new Date(i._record.updated_at || i._record.created_at).getTime();
      m.closeDays.push(Math.max(0, (d1 - d0) / 86400000));
    }
    if (i.status === 'pending') m.pending += 1;
    if (i.status === 'overdue') m.overdue += 1;
    m.subs[i.sub] = (m.subs[i.sub] || 0) + 1;
  });
  const storeArr = Object.entries(storeMap).map(([s, m]) => {
    const r = m.total ? Math.round(m.verified / m.total * 100) : 0;
    const avgDays = m.closeDays.length ? +(m.closeDays.reduce((a, b) => a + b, 0) / m.closeDays.length).toFixed(1) : null;
    const topSubs = Object.entries(m.subs).sort((a, b) => b[1] - a[1]).slice(0, 3).map(([sub, c]) => `${sub}${c}`);
    return { s, ...m, r, avgDays, topSubs };
  }).sort((a, b) => b.total - a.total);
  const storeMax = storeArr.length ? storeArr[0].total : 1;
  const avgRate = storeArr.length ? Math.round(storeArr.reduce((a, b) => a + b.r, 0) / storeArr.length) : 0;

  // 连续高风险门店（近 3 个月，每月高风险 = 待整改≥3 或 闭环率<40）
  const persist = useMemo(() => {
    const flags = {};
    monthOptions.forEach(o => {
      const items = allItems.filter(i => inMonth(i._record.created_at, o.key));
      const map = {};
      items.forEach(i => {
        const k = i._record.target_store;
        if (!map[k]) map[k] = { total: 0, verified: 0, pending: 0 };
        map[k].total += 1;
        if (i.status === 'verified') map[k].verified += 1;
        if (i.status === 'pending') map[k].pending += 1;
      });
      Object.entries(map).forEach(([s, m]) => {
        const r = m.total ? (m.verified / m.total) * 100 : 0;
        if (m.pending >= 3 || r < 40) { (flags[s] = flags[s] || new Set()).add(o.key); }
      });
    });
    return Object.entries(flags)
      .map(([s, set]) => ({ s, months: [...set].sort(), count: set.size }))
      .filter(x => x.count >= 2)
      .sort((a, b) => b.count - a.count);
  }, [allItems, monthOptions]);

  // 整改时效（整体）
  const allCloseDays = storeArr.flatMap(m => m.closeDays);
  const avgCloseDays = allCloseDays.length ? +(allCloseDays.reduce((a, b) => a + b, 0) / allCloseDays.length).toFixed(1) : null;
  const slowStores = storeArr.filter(m => m.avgDays !== null).sort((a, b) => b.avgDays - a.avgDays).slice(0, 5);

  // 问题类别 TOP5
  const subMap = {};
  monthItems.forEach(i => { subMap[i.sub] = (subMap[i.sub] || 0) + 1; });
  const subArr = Object.entries(subMap).sort((a, b) => b[1] - a[1]).slice(0, 5);
  const subMax = subArr.length ? subArr[0][1] : 1;
  const subColors = ['#6366f1', '#f59e0b', '#10b981', '#ec4899', '#06b6d4'];

  const focus = storeArr.filter(m => m.pending >= 3 || m.r < 40);

  const drillStore = drill ? storeMap[drill] : null;
  const drillSubs = drillStore ? Object.entries(drillStore.subs).sort((a, b) => b[1] - a[1]) : [];
  const drillMax = drillSubs.length ? drillSubs[0][1] : 1;

  const rateColor = (r) => r >= TARGET_RATE ? '#10b981' : r >= 40 ? '#f59e0b' : '#f43f5e';

  const exportXlsx = () => {
    if (typeof XLSX === 'undefined') { alert('导出组件未加载，请刷新页面后重试'); return; }
    const rows = monthItems.map(i => ({
      '门店': i._record.target_store,
      '提交门店': i._record.submitter_store,
      '周': i._record.week_label,
      '时段': PERIOD_LABELS[i.period || i._record.period],
      '问题类别': i.sub,
      '描述': i.desc,
      '状态': STATUS_LABELS[i.status] || i.status,
      '方案': i.solution || '',
      '节点': i.due_date || '',
      '创建时间': formatDateTime(i._record.created_at),
    }));
    const ws = XLSX.utils.json_to_sheet(rows);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, month + '镜检');
    XLSX.writeFile(wb, `镜检月度_${month}.xlsx`);
  };

  return (
    <div className="max-w-5xl mx-auto px-4 py-6 fade-in">
      <div className="flex items-center justify-between mb-1 flex-wrap gap-2">
        <h2 className="text-lg font-bold text-gray-900">月度看板 · 趋势分析</h2>
        <div className="flex items-center gap-2">
          <button onClick={exportXlsx} className="px-3 py-1.5 rounded-lg text-sm font-medium bg-emerald-600 hover:bg-emerald-500 text-white transition">导出 Excel</button>
          <select value={month} onChange={e => { setMonth(e.target.value); setDrill(null); }}
            className="bg-gray-50 border border-gray-300 rounded-lg px-3 py-1.5 text-sm text-gray-900 outline-none">
            {monthOptions.map(o => <option key={o.key} value={o.key}>{o.label}（{o.key}）</option>)}
          </select>
        </div>
      </div>
      <p className="text-sm text-gray-500 mb-4">按自然月统计，横向对比各周、各门店、各类别表现，辅助月度复盘。月度闭环率目标 <span className="font-medium text-gray-700">{TARGET_RATE}%</span>。</p>

      {/* 概览卡片 */}
      <div className="grid grid-cols-2 md:grid-cols-4 gap-3 mb-5">
        <div className="bg-white border border-gray-200 rounded-xl p-4">
          <p className="text-xs text-gray-500 mb-1">本月新增问题</p>
          <p className="text-2xl font-bold text-gray-900">{total}</p>
          <p className={`text-xs mt-1 ${newDelta > 0 ? 'text-rose-600' : newDelta < 0 ? 'text-emerald-600' : 'text-gray-400'}`}>{newDelta > 0 ? '▲' : newDelta < 0 ? '▼' : '—'} {Math.abs(newDelta)} 环比</p>
        </div>
        <div className="bg-white border border-gray-200 rounded-xl p-4"><p className="text-xs text-gray-500 mb-1">本月待整改</p><p className="text-2xl font-bold text-amber-600">{pending}</p></div>
        <div className="bg-white border border-gray-200 rounded-xl p-4"><p className="text-xs text-gray-500 mb-1">本月闭环</p><p className="text-2xl font-bold text-emerald-600">{verified}</p></div>
        <div className="bg-white border border-gray-200 rounded-xl p-4 flex items-center gap-3">
          <div className="relative w-12 h-12 shrink-0 rounded-full" style={{ background: `conic-gradient(${rateColor(rate)} ${rate}%, #e5e7eb ${rate}%)` }}>
            <div className="absolute inset-1.5 bg-white rounded-full flex items-center justify-center"><span className="text-[11px] font-bold" style={{ color: rateColor(rate) }}>{rate}%</span></div>
          </div>
          <div>
            <p className="text-xs text-gray-500">月度闭环率</p>
            <p className={`text-xs font-medium ${rateDelta >= 0 ? 'text-emerald-600' : 'text-rose-600'}`}>{rateDelta >= 0 ? '▲' : '▼'} {Math.abs(rateDelta)}% 环比</p>
            <p className="text-[10px] text-gray-400">目标 {TARGET_RATE}%</p>
          </div>
        </div>
      </div>

      {/* 周趋势 */}
      <div className="bg-white border border-gray-200 rounded-xl p-4 mb-5">
        <p className="text-sm font-semibold text-gray-900 mb-3">周趋势（当月逐周：新增 / 该周问题已闭环）</p>
        {weeks.length === 0 ? <p className="text-xs text-gray-400">本月暂无数据</p> : (
          <div className="flex items-end justify-between gap-2 sm:gap-3 h-44">
            {weeks.map(w => (
              <div key={w} className="flex-1 flex flex-col items-center justify-end h-full min-w-0">
                <div className="flex items-end gap-1 w-full justify-center" style={{ height: '78%' }}>
                  <div className="w-3 sm:w-5 bg-indigo-400 rounded-t" style={{ height: `${Math.round(weekMap[w].n / weekMax * 100)}%` }} title={`新增 ${weekMap[w].n}`}></div>
                  <div className="w-3 sm:w-5 bg-emerald-400 rounded-t" style={{ height: `${Math.round(weekMap[w].c / weekMax * 100)}%` }} title={`已闭环 ${weekMap[w].c}`}></div>
                </div>
                <p className="text-[10px] text-gray-500 mt-1 text-center leading-tight truncate w-full">{w.replace(/-W/, ' W')}</p>
              </div>
            ))}
          </div>
        )}
        <div className="flex gap-4 mt-2 text-xs text-gray-500">
          <span className="flex items-center gap-1"><span className="w-3 h-3 rounded-sm bg-indigo-400"></span>新增</span>
          <span className="flex items-center gap-1"><span className="w-3 h-3 rounded-sm bg-emerald-400"></span>已闭环</span>
        </div>
      </div>

      {/* 时段拆分 + 整改时效 */}
      <div className="grid grid-cols-1 md:grid-cols-2 gap-3 mb-5">
        <div className="bg-white border border-gray-200 rounded-xl p-4">
          <p className="text-sm font-semibold text-gray-900 mb-3">时段分布（周内 / 周末）</p>
          <div className="space-y-3">
            {[['周内', periodSplit.wd, periodSplit.wdRate], ['周末', periodSplit.we, periodSplit.weRate]].map(([label, o, rt]) => {
              const denom = periodSplit.wd.total + periodSplit.we.total || 1;
              return (
                <div key={label}>
                  <div className="flex justify-between text-xs mb-1"><span className="text-gray-700">{label}</span><span className="text-gray-500">{o.total} 项 · 闭环 {rt}%</span></div>
                  <div className="bg-gray-100 rounded-full h-3 overflow-hidden"><div className="h-3 rounded-full bg-indigo-500" style={{ width: `${o.total ? Math.round(o.total / denom * 100) : 0}%` }}></div></div>
                </div>
              );
            })}
          </div>
          <p className="text-xs text-gray-400 mt-3">周末问题占比偏高，多与排班 / 带训相关，建议重点排查。</p>
        </div>
        <div className="bg-white border border-gray-200 rounded-xl p-4">
          <p className="text-sm font-semibold text-gray-900 mb-3">整改时效（SLA）</p>
          <div className="flex items-center gap-6 mb-3">
            <div><p className="text-xs text-gray-500">本月逾期</p><p className="text-2xl font-bold text-rose-600">{overdue}</p></div>
            <div><p className="text-xs text-gray-500">全店平均闭环</p><p className="text-2xl font-bold text-gray-900">{avgCloseDays === null ? '—' : avgCloseDays + ' 天'}</p></div>
          </div>
          <p className="text-xs text-gray-500 mb-1">闭环最慢的门店（TOP5）</p>
          {slowStores.length === 0 ? <p className="text-xs text-gray-400">本月暂无已闭环记录</p> : (
            <div className="space-y-1.5">
              {slowStores.map(m => (
                <div key={m.s} className="flex items-center gap-2 text-xs">
                  <span className="w-24 truncate text-gray-700" title={m.s}>{m.s}</span>
                  <span className="w-16 text-right text-rose-600 font-medium">{m.avgDays} 天</span>
                </div>
              ))}
            </div>
          )}
        </div>
      </div>

      {/* 门店月度排名 + 类别 TOP5 */}
      <div className="grid grid-cols-1 md:grid-cols-2 gap-3 mb-5">
        <div className="bg-white border border-gray-200 rounded-xl p-4">
          <p className="text-sm font-semibold text-gray-900 mb-3">门店月度排名（点击展开看类别）</p>
          {storeArr.length === 0 ? <p className="text-xs text-gray-400">本月暂无数据</p> : (
            <div className="space-y-1">
              {storeArr.map((m, idx) => (
                <div key={m.s}>
                  <button onClick={() => setDrill(drill === m.s ? null : m.s)} className="w-full flex items-center gap-2 text-sm text-left hover:bg-gray-50 rounded px-1 py-1 transition">
                    <span className="w-4 text-gray-400 text-xs">{idx + 1}</span>
                    <span className="w-24 truncate text-gray-700" title={m.s}>{m.s}</span>
                    <div className="flex-1 bg-gray-100 rounded-full h-3 overflow-hidden">
                      <div className="h-3 rounded-full" style={{ width: `${Math.round(m.total / storeMax * 100)}%`, background: rateColor(m.r) }}></div>
                    </div>
                    <span className="w-16 text-right text-xs text-gray-500">闭环{m.r}%</span>
                    {m.overdue > 0 && <span className="text-rose-600 text-xs w-12 text-right">逾期{m.overdue}</span>}
                  </button>
                  {drill === m.s && (
                    <div className="ml-9 mt-1 mb-1 space-y-1">
                      {drillSubs.length === 0 ? <p className="text-xs text-gray-400">无类别数据</p> : drillSubs.map(([sub, c]) => (
                        <div key={sub} className="flex items-center gap-2 text-xs">
                          <span className="w-24 truncate text-gray-600">{sub}</span>
                          <div className="flex-1 bg-gray-100 rounded-full h-2.5 overflow-hidden"><div className="h-2.5 rounded-full bg-indigo-400" style={{ width: `${Math.round(c / drillMax * 100)}%` }}></div></div>
                          <span className="w-6 text-right text-gray-500">{c}</span>
                        </div>
                      ))}
                      <p className="text-[11px] text-gray-400">该店高频问题：{m.topSubs.join('、') || '—'}</p>
                    </div>
                  )}
                </div>
              ))}
            </div>
          )}
          <p className="text-[11px] text-gray-400 mt-2">平均闭环率 {avgRate}% · 目标线 {TARGET_RATE}%（红 &lt;40% / 橙 &lt;{TARGET_RATE}% / 绿 达标）</p>
        </div>
        <div className="bg-white border border-gray-200 rounded-xl p-4">
          <p className="text-sm font-semibold text-gray-900 mb-3">问题类别 TOP5（本月）</p>
          {subArr.length === 0 ? <p className="text-xs text-gray-400">本月暂无数据</p> : (
            <div className="space-y-2.5">
              {subArr.map(([s, c], i) => (
                <div key={s}>
                  <div className="flex justify-between text-xs mb-1">
                    <span className="text-gray-700 truncate max-w-[8rem]" title={s}>{s}</span>
                    <span className="text-gray-500">{c}（{Math.round(c / total * 100)}%）</span>
                  </div>
                  <div className="bg-gray-100 rounded-full h-2.5 overflow-hidden">
                    <div className="h-2.5 rounded-full" style={{ width: `${Math.round(c / subMax * 100)}%`, background: subColors[i % subColors.length] }}></div>
                  </div>
                </div>
              ))}
            </div>
          )}
        </div>
      </div>

      {/* 连续高风险门店 */}
      <div className="bg-rose-50 border border-rose-200 rounded-xl p-4 mb-5">
        <p className="text-sm font-semibold text-rose-700 mb-2">连续高风险门店（近 3 个月 ≥2 月被标红）</p>
        {persist.length === 0
          ? <span className="text-xs text-rose-600">近 3 个月无连续高风险的门店，继续保持。</span>
          : <div className="flex flex-wrap gap-2">
              {persist.map(m => (
                <span key={m.s} className="inline-flex items-center gap-1 px-2.5 py-1 rounded-full bg-white border border-rose-300 text-xs text-rose-700">
                  {m.s} · 连续 {m.count} 个月 · {m.months.join('/')}
                </span>
              ))}
            </div>}
      </div>

      {/* 本月重点关注门店 */}
      <div className="bg-amber-50 border border-amber-200 rounded-xl p-4">
        <p className="text-sm font-semibold text-amber-700 mb-2">本月重点关注门店</p>
        {focus.length === 0
          ? <span className="text-xs text-amber-600">本月无高风险门店（待整改&lt;3 且 闭环率≥40%），继续保持。</span>
          : <div className="flex flex-wrap gap-2">
              {focus.map(m => (
                <span key={m.s} className="inline-flex items-center gap-1 px-2.5 py-1 rounded-full bg-white border border-amber-300 text-xs text-amber-700">
                  {m.s} · 待整改{m.pending} · 闭环{m.r}%
                </span>
              ))}
            </div>}
      </div>
    </div>
  );
}

/* ============ 门店看板（当前门店视角） ============ */
function StoreDashboardView({ records, currentStore, onReload }) {
  const [ownFilter, setOwnFilter] = useState('all');
  const [otherFilter, setOtherFilter] = useState('all');
  const [mobileTab, setMobileTab] = useState('own');
  const [rework, setRework] = useState(null);
  const [track, setTrack] = useState(null);
  const canEdit = (rec) => rec.target_store === currentStore;
  const isTracker = (rec) => rec.submitter_store === currentStore;

  const ownItems = useMemo(() => {
    const out = [];
    records.filter(r => r.target_store === currentStore).forEach(r => (r.items || []).forEach(it => out.push({ ...it, _record: r })));
    return out.sort((a, b) => new Date(b._record.created_at) - new Date(a._record.created_at));
  }, [records, currentStore]);

  const otherItems = useMemo(() => {
    const out = [];
    records.filter(r => r.submitter_store === currentStore && r.target_store !== currentStore).forEach(r => (r.items || []).forEach(it => out.push({ ...it, _record: r })));
    return out.sort((a, b) => new Date(b._record.created_at) - new Date(a._record.created_at));
  }, [records, currentStore]);

  const total = ownItems.length;
  const pending = ownItems.filter(i => i.status === 'pending').length;
  const done = ownItems.filter(i => i.status === 'done').length;
  const verified = ownItems.filter(i => i.status === 'verified').length;
  const overdue = ownItems.filter(i => i.status === 'overdue').length;

  const completeRate = total ? Math.round(verified / total * 100) : 0;

  const subMap = {};
  ownItems.forEach(i => { subMap[i.sub] = (subMap[i.sub] || 0) + 1; });
  const subArr = Object.entries(subMap).sort((a, b) => b[1] - a[1]);
  const subColors = ['#6366f1', '#f59e0b', '#10b981', '#ec4899', '#06b6d4', '#84cc16', '#8b5cf6', '#f97316'];
  const subSlices = subArr.slice(0, 5).map(([sub, cnt], i) => ({ sub, cnt, pct: Math.round(cnt / total * 100), color: subColors[i % subColors.length] }));

  function groupByRecord(items) {
    const map = {};
    items.forEach(it => {
      const rid = it._record.id;
      if (!map[rid]) map[rid] = { record: it._record, items: [] };
      map[rid].items.push(it);
    });
    return Object.values(map).sort((a, b) => new Date(b.record.created_at) - new Date(a.record.created_at));
  }

  const ownGroups = useMemo(() => groupByRecord(ownItems), [ownItems]);
  const otherGroups = useMemo(() => groupByRecord(otherItems), [otherItems]);
  const ownFiltered = ownFilter === 'all' ? ownGroups : ownGroups.filter(g => g.items.some(i => i.status === ownFilter));
  const otherFiltered = otherFilter === 'all' ? otherGroups : otherGroups.filter(g => g.items.some(i => i.status === otherFilter));

  const saveRework = async () => {
    if (!rework) return;
    // 剔除内部附加字段 _record，并给缺失字段补默认值
    const finalItems = rework.items.map(it => {
      const { _record, ...rest } = it;
      return { status: 'pending', solution: '', due_date: '', rework_note: '', ...rest };
    });
    await updateRecord(rework.recordId, finalItems);
    setRework(null);
    onReload();
  };

  const saveTrack = async () => {
    if (!track) return;
    const finalItems = track.items.map(it => {
      const { _record, ...rest } = it;
      let status = rest.status;
      if (rest.track_result === 'improved') status = 'verified';
      else if (rest.track_result === 'partial') status = 'partial';
      else if (rest.track_result === 'not_improved') status = 'pending';
      return {
        status: 'pending', solution: '', due_date: '', rework_note: '',
        tracker_store: rest.tracker_store || track.record.submitter_store,
        track_at: new Date().toISOString(),
        track_images: rest.track_images || [],
        ...rest, status,
      };
    });
    await updateRecord(track.recordId, finalItems);
    setTrack(null);
    onReload();
  };

  const renderRecordCard = (group, mode = 'own') => {
    const rec = group.record;
    const allVerified = group.items.every(i => i.status === 'verified');
    const anyReturn = group.items.some(i => i.status === 'partial' || i.status === 'overdue');
    const anyWait = group.items.some(i => i.status === 'done');
    const borderCls = allVerified ? 'border-l-4 border-l-emerald-400' : (anyReturn ? 'border-l-4 border-l-rose-400' : (anyWait ? 'border-l-4 border-l-sky-400' : ''));
    return (
      <div key={rec.id} className={`border border-gray-200 rounded-lg p-4 bg-gray-50 ${borderCls}`}>
        <div className="flex items-center gap-2 mb-3 flex-wrap">
          <span className="text-xs text-gray-400">{rec.week_label} · {formatDateTime(rec.created_at)} · {mode === 'own' ? '提交人' : '问题门店'} {mode === 'own' ? rec.submitter_store : rec.target_store}</span>
        </div>
        <div className="space-y-3">
          {group.items.map(it => (
            <div key={it.id} className="border-b border-gray-200 last:border-0 pb-3 last:pb-0">
              <div className="flex items-center gap-2 mb-1 flex-wrap">
                <Badge text={it.sub} cls="bg-indigo-50 text-indigo-700 border-indigo-300" />
                <Badge text={STATUS_LABELS[it.status] || '待整改'} cls={STATUS_COLOR[it.status] || ''} />
                <span className="text-xs text-gray-400">{PERIOD_LABELS[it.period || rec.period]}</span>
              </div>
              <p className="text-sm text-gray-700 leading-relaxed mb-1">{it.desc}</p>
              <ImageGallery images={it.images} className="mb-1" />
              {it.solution && <p className="text-xs text-emerald-600">方案：{it.solution}{it.due_date ? `（节点 ${it.due_date}）` : ''}</p>}
              {it.rework_images && it.rework_images.length > 0 && <ImageGallery images={it.rework_images} className="mb-1" />}
              {it.status === 'overdue' && it.rework_note && <p className="text-xs text-rose-600">重盘：{it.rework_note}</p>}
              {it.track_result && (
                <div className="mb-1">
                  <p className="text-xs text-emerald-600">追踪（{it.tracker_store}）：{TRACK_LABELS[it.track_result]}{it.track_note ? ` — ${it.track_note}` : ''}</p>
                  <ImageGallery images={it.track_images} className="mt-1" />
                </div>
              )}
            </div>
          ))}
        </div>
        {mode === 'own' ? (
          canEdit(rec) && (
            <button onClick={() => {
              setRework({
                recordId: rec.id,
                record: rec,
                items: (group.items || []).map(it => {
                  const { _record, ...itRest } = it;
                  return { status: 'pending', solution: '', due_date: '', rework_note: '', ...itRest };
                })
              });
            }} className="mt-3 text-xs px-3 py-2 rounded-lg bg-indigo-50 text-indigo-700 border border-indigo-300 hover:bg-indigo-100 transition">复盘 / 跟进</button>
          )
        ) : (
          isTracker(rec) && (
            <button onClick={() => {
              setTrack({
                recordId: rec.id,
                record: rec,
                items: (group.items || []).map(it => {
                  const { _record, ...itRest } = it;
                  return { track_result: '', track_note: '', status: 'pending', solution: '', due_date: '', rework_note: '', ...itRest };
                })
              });
            }} className="mt-3 text-xs px-3 py-2 rounded-lg bg-emerald-50 text-emerald-700 border border-emerald-300 hover:bg-emerald-100 transition">追踪验收</button>
          )
        )}
      </div>
    );
  };

  return (
    <div className="max-w-5xl mx-auto px-4 py-6 fade-in">
      <h2 className="text-lg font-bold text-gray-900 mb-1">门店看板 · {currentStore}</h2>
      <p className="text-sm text-gray-500 mb-4">本门店被检查的历史记录、整改进度与类别分析。</p>

      <div className="grid grid-cols-2 md:grid-cols-5 gap-3 mb-5">
        <div className="bg-white border border-gray-200 rounded-xl p-4">
          <p className="text-xs text-gray-500 mb-1">总问题</p>
          <p className="text-2xl font-bold text-gray-900">{total}</p>
        </div>
        <div className="bg-white border border-gray-200 rounded-xl p-4">
          <p className="text-xs text-gray-500 mb-1">待整改</p>
          <p className="text-2xl font-bold text-amber-600">{pending}</p>
        </div>
        <div className="bg-white border border-gray-200 rounded-xl p-4">
          <p className="text-xs text-gray-500 mb-1">待验收</p>
          <p className="text-2xl font-bold text-sky-600">{done}</p>
        </div>
        <div className="bg-white border border-gray-200 rounded-xl p-4">
          <p className="text-xs text-gray-500 mb-1">已验收</p>
          <p className="text-2xl font-bold text-emerald-600">{verified}</p>
        </div>
        <div className="bg-white border border-gray-200 rounded-xl p-4">
          <p className="text-xs text-gray-500 mb-1">已超期</p>
          <p className="text-2xl font-bold text-rose-600">{overdue}</p>
        </div>
      </div>

      <div className="grid gap-3 md:grid-cols-2 mb-5">
        <div className="bg-white border border-gray-200 rounded-xl p-5">
          <h3 className="text-sm font-semibold text-gray-900 mb-4">类别占比（TOP5）</h3>
          {total === 0 ? <p className="text-sm text-gray-500">暂无数据</p> : (
            <div className="flex items-center gap-4">
              <div className="w-20 h-20 rounded-full flex-shrink-0" style={{
                background: `conic-gradient(${subSlices.map((s, i, a) => {
                  const prev = a.slice(0, i).reduce((sum, x) => sum + x.pct, 0);
                  return `${s.color} ${prev}% ${prev + s.pct}%`;
                }).join(', ')})`
              }}></div>
              <div className="text-sm space-y-1.5">
                {subSlices.map(s => (
                  <div key={s.sub} className="flex items-center gap-2">
                    <span className="w-3 h-3 rounded-full" style={{ background: s.color }}></span>
                    <span className="truncate max-w-[6rem]" title={s.sub}>{s.sub}</span>
                    <span className="text-gray-500">{s.cnt}（{s.pct}%）</span>
                  </div>
                ))}
                {subArr.length > 5 && <div className="text-xs text-gray-400">另有 {subArr.length - 5} 项</div>}
              </div>
            </div>
          )}
        </div>
        <div className="bg-white border border-gray-200 rounded-xl p-5">
          <h3 className="text-sm font-semibold text-gray-900 mb-4">整改完成率</h3>
          <p className="text-3xl font-bold text-emerald-600">{completeRate}%</p>
          <p className="text-xs text-gray-500 mt-1">{verified} 已验收闭环 / {total} 总问题</p>
          <div className="mt-3 h-2 rounded-full bg-gray-100 overflow-hidden">
            <div className="h-full bg-emerald-500" style={{ width: completeRate + '%' }}></div>
          </div>
        </div>
      </div>

      <div className="bg-white border border-gray-200 rounded-xl p-5 mb-5">
        <h3 className="text-sm font-semibold text-gray-900 mb-3">子分类问题数</h3>
        {subArr.length === 0 ? <p className="text-sm text-gray-500">暂无数据</p> : (
          <div className="space-y-2">
            {subArr.map(([sub, cnt]) => {
              const max = subArr[0][1] || 1;
              return (
                <div key={sub} className="flex items-center gap-3">
                  <span className="text-xs text-gray-600 w-24 flex-shrink-0">{sub}</span>
                  <div className="flex-1 h-3 rounded-full bg-gray-100 overflow-hidden">
                    <div className="h-full bg-indigo-500" style={{ width: Math.round(cnt / max * 100) + '%' }}></div>
                  </div>
                  <span className="text-xs text-gray-600 w-6 text-right">{cnt}</span>
                </div>
              );
            })}
          </div>
        )}
      </div>

      {/* 移动端：下拉切换 + 单列表 */}
      <div className="md:hidden mb-4">
        <label className="block text-xs text-gray-500 mb-1">查看范围</label>
        <select value={mobileTab} onChange={e => setMobileTab(e.target.value)}
          className="w-full bg-white border border-gray-300 rounded-lg px-3 py-2.5 text-sm text-gray-900 outline-none">
          <option value="own">本门店问题（{ownFiltered.length}）</option>
          <option value="other">其他门店问题（{otherFiltered.length}）</option>
        </select>
      </div>

      <div className="md:hidden bg-white border border-gray-200 rounded-xl p-5">
        <div className="flex items-center justify-between mb-3 flex-wrap gap-2">
          <h3 className="text-sm font-semibold text-gray-900">{mobileTab === 'own' ? '本门店问题' : '其他门店问题'}</h3>
          <div className="flex gap-2">
            {[{ k: 'all', t: '全部' }, { k: 'pending', t: '待整改' }, { k: 'done', t: '待验收' }, { k: 'verified', t: '已验收' }, { k: 'overdue', t: '已超期' }].map(f => (
              <button key={f.k} onClick={() => mobileTab === 'own' ? setOwnFilter(f.k) : setOtherFilter(f.k)}
                className={`px-3 py-1 rounded-lg text-xs font-medium border transition ${(mobileTab === 'own' ? ownFilter : otherFilter) === f.k ? 'bg-indigo-50 text-indigo-700 border-indigo-300' : 'text-gray-600 border-gray-300 hover:bg-gray-100'}`}>{f.t}</button>
            ))}
          </div>
        </div>
        {(mobileTab === 'own' ? ownFiltered : otherFiltered).length === 0 ? <p className="text-sm text-gray-500 py-6 text-center">暂无记录</p> : (
          <div className="space-y-3">{(mobileTab === 'own' ? ownFiltered : otherFiltered).map(g => renderRecordCard(g, mobileTab))}</div>
        )}
      </div>

      {/* PC 端：左右双列 */}
      <div className="hidden md:grid gap-4 md:grid-cols-2">
        <div className="bg-white border border-gray-200 rounded-xl p-5">
          <div className="flex items-center justify-between mb-3 flex-wrap gap-2">
            <h3 className="text-sm font-semibold text-gray-900">本门店问题</h3>
            <div className="flex gap-2">
              {[{ k: 'all', t: '全部' }, { k: 'pending', t: '待整改' }, { k: 'done', t: '待验收' }, { k: 'verified', t: '已验收' }, { k: 'overdue', t: '已超期' }].map(f => (
                <button key={f.k} onClick={() => setOwnFilter(f.k)}
                  className={`px-3 py-1 rounded-lg text-xs font-medium border transition ${ownFilter === f.k ? 'bg-indigo-50 text-indigo-700 border-indigo-300' : 'text-gray-600 border-gray-300 hover:bg-gray-100'}`}>{f.t}</button>
              ))}

          </div>
          {ownFiltered.length === 0 ? <p className="text-sm text-gray-500 py-6 text-center">暂无记录</p> : (
            <div className="space-y-3">{ownFiltered.map(g => renderRecordCard(g, 'own'))}</div>

        </div>

        <div className="bg-white border border-gray-200 rounded-xl p-5">
          <div className="flex items-center justify-between mb-3 flex-wrap gap-2">
            <h3 className="text-sm font-semibold text-gray-900">其他门店问题</h3>

                <button key={f.k} onClick={() => setOtherFilter(f.k)}

      <Modal open={!!rework} onClose={() => setRework(null)} title={`复盘跟进${rework ? `（${rework.items.length} 个问题）` : ''}`}>
        {rework && (
          <div className="space-y-4">
            {rework.items.map((it) => (
              <div key={it.id} className="bg-gray-50 border border-gray-200 rounded-lg p-3 space-y-2">

                    <option value="pending">待整改</option>
                    <option value="done">已整改（待验收）</option>

                </div>
                <div>
                  <label className="block text-xs text-gray-500 mb-1">解决方案</label>
                  <textarea value={it.solution || ''} onChange={e => setRework(prev => ({ ...prev, items: prev.items.map(x => x.id === it.id ? { ...x, solution: e.target.value } : x) }))} rows={2}
                    placeholder="这个问题怎么改"
                    className="w-full bg-white border border-gray-300 rounded-lg px-3 py-2 text-sm text-gray-900 placeholder-gray-400 outline-none resize-none" />
                </div>
                <div className="bg-white border border-gray-200 rounded-lg p-3">
                  <div className="flex items-center justify-between mb-2">

                  </div>
                  {(it.rework_images || []).length > 0 && (
                    <div className="flex flex-wrap gap-2 mb-2">
                      {(it.rework_images || []).map((src, idx) => (

                          <button onClick={() => setRework(prev => ({ ...prev, items: prev.items.map(x => x.id === it.id ? { ...x, rework_images: (x.rework_images || []).filter((_, j) => j !== idx) } : x) }))}
                            className="absolute top-0.5 right-0.5 w-5 h-5 rounded-full bg-black/50 text-white text-xs flex items-center justify-center hover:bg-black/70">×</button>
                        </div>
                      ))}
                    </div>
                  )}
                  {(it.rework_images || []).length < 3 && (
                    <label className="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg border border-dashed border-gray-300 text-xs text-gray-600 hover:border-indigo-500 hover:text-indigo-600 cursor-pointer transition">
                      <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="1.5" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5M12 3v13.5m0 0 4.5-4.5m-4.5 4.5L7.5 12" /></svg>
                      上传整改照片
                      <input type="file" accept="image/*" multiple className="hidden"
                        onChange={async e => {
                          const files = Array.from(e.target.files || []);
                          const remaining = 3 - (it.rework_images || []).length;
                          const toAdd = files.slice(0, remaining);
                          const compressed = await Promise.all(toAdd.map(f => compressImage(f).catch(() => null)));
                          const added = compressed.filter(Boolean);
                          setRework(prev => ({ ...prev, items: prev.items.map(x => x.id === it.id ? { ...x, rework_images: [...(x.rework_images || []), ...added] } : x) }));
                          e.target.value = '';
                        }} />
                    </label>
                  )}
                </div>
                <div>
                  <label className="block text-xs text-gray-500 mb-1">整改时间节点</label>
                  <input type="date" value={it.due_date || ''} onChange={e => setRework(prev => ({ ...prev, items: prev.items.map(x => x.id === it.id ? { ...x, due_date: e.target.value } : x) }))}
                    className="w-full bg-white border border-gray-300 rounded-lg px-3 py-2 text-sm text-gray-900 outline-none" />
                </div>
                {it.status === 'overdue' && (
                  <div>
                    <label className="block text-xs text-gray-500 mb-1">重新复盘说明（为何未达成）</label>
                    <textarea value={it.rework_note || ''} onChange={e => setRework(prev => ({ ...prev, items: prev.items.map(x => x.id === it.id ? { ...x, rework_note: e.target.value } : x) }))} rows={2}
                      className="w-full bg-white border border-gray-300 rounded-lg px-3 py-2 text-sm text-gray-900 placeholder-gray-400 outline-none resize-none" />
                  </div>
                )}
              </div>
            ))}
            <div className="flex gap-2 pt-1">
              <button onClick={() => setRework(null)} className="flex-1 py-2 rounded-lg text-sm text-gray-600 hover:text-gray-900 hover:bg-gray-100 transition">取消</button>
              <button onClick={saveRework} className="flex-1 py-2 rounded-lg text-sm font-medium bg-indigo-600 hover:bg-indigo-500 text-white transition">保存</button>
            </div>
          </div>
        )}
      </Modal>

      <Modal open={!!track} onClose={() => setTrack(null)} title="追踪验收">
        {track && (
          <div className="space-y-4">
            <p className="text-xs text-gray-500">你是该记录的提交门店（追踪人 {track.record.submitter_store}），请确认被检查门店 {track.record.target_store} 的整改是否到位。</p>
            {track.items.map((it) => (
              <div key={it.id} className="bg-gray-50 border border-gray-200 rounded-lg p-3 space-y-2">
                <div className="flex items-center gap-2 mb-1 flex-wrap">
                  <Badge text={it.sub} cls="bg-indigo-50 text-indigo-700 border-indigo-300" />
                  <Badge text={STATUS_LABELS[it.status] || '待整改'} cls={STATUS_COLOR[it.status] || ''} />
                </div>
                <p className="text-sm text-gray-700 leading-relaxed mb-1">{it.desc}</p>
                <ImageGallery images={it.images} className="mb-1" />
                {it.solution && <p className="text-xs text-emerald-600">其方案：{it.solution}{it.due_date ? `（节点 ${it.due_date}）` : ''}</p>}
                <div>
                  <label className="block text-xs text-gray-500 mb-1">追踪结果</label>
                  <select value={it.track_result || ''} onChange={e => setTrack(prev => ({ ...prev, items: prev.items.map(x => x.id === it.id ? { ...x, track_result: e.target.value } : x) }))}
                    className="w-full bg-white border border-gray-300 rounded-lg px-3 py-2 text-gray-900 outline-none">
                    <option value="">待判定</option>
                    <option value="improved">已改善（验收闭环）</option>
                    <option value="partial">部分改善（需继续跟）</option>
                    <option value="not_improved">未改善（退回重改）</option>
                  </select>
                </div>
                <div>
                  <label className="block text-xs text-gray-500 mb-1">追踪备注（现场看到什么 / 是否反弹）</label>
                  <textarea value={it.track_note || ''} onChange={e => setTrack(prev => ({ ...prev, items: prev.items.map(x => x.id === it.id ? { ...x, track_note: e.target.value } : x) }))} rows={2}
                    placeholder="记录改善情况"
                    className="w-full bg-white border border-gray-300 rounded-lg px-3 py-2 text-sm text-gray-900 placeholder-gray-400 outline-none resize-none" />
                </div>
                <div>
                  <div className="flex items-center justify-between mb-2">
                    <span className="text-xs text-gray-500">追踪现场照片（选填，最多 3 张）</span>
                    <span className="text-xs text-gray-400">{(it.track_images || []).length}/3</span>
                  </div>
                  {(it.track_images || []).length > 0 && (
                    <div className="flex flex-wrap gap-2 mb-2">
                      {(it.track_images || []).map((src, idx) => (
                        <div key={idx} className="relative w-16 h-16 rounded-lg border border-gray-200 overflow-hidden bg-gray-100">
                          <img src={src} alt={`追踪图片 ${idx + 1}`} className="w-full h-full object-cover" />
                          <button onClick={() => setTrack(prev => ({ ...prev, items: prev.items.map(x => x.id === it.id ? { ...x, track_images: (x.track_images || []).filter((_, j) => j !== idx) } : x) }))}
                            className="absolute top-0.5 right-0.5 w-5 h-5 rounded-full bg-black/50 text-white text-xs flex items-center justify-center hover:bg-black/70">×</button>
                        </div>
                      ))}
                    </div>
                  )}
                  {(it.track_images || []).length < 3 && (
                    <label className="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg border border-dashed border-gray-300 text-xs text-gray-600 hover:border-emerald-500 hover:text-emerald-600 cursor-pointer transition">
                      <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="1.5" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5M12 3v13.5m0 0 4.5-4.5m-4.5 4.5L7.5 12" /></svg>
                      上传追踪照片
                      <input type="file" accept="image/*" multiple className="hidden"
                        onChange={async e => {
                          const files = Array.from(e.target.files || []);
                          const remaining = 3 - (it.track_images || []).length;
                          const toAdd = files.slice(0, remaining);
                          const compressed = await Promise.all(toAdd.map(f => compressImage(f).catch(() => null)));
                          const added = compressed.filter(Boolean);
                          setTrack(prev => ({ ...prev, items: prev.items.map(x => x.id === it.id ? { ...x, track_images: [...(x.track_images || []), ...added] } : x) }));
                          e.target.value = '';
                        }} />

                  )}

              </div>
            ))}
            <div className="flex gap-2 pt-1">
              <button onClick={() => setTrack(null)} className="flex-1 py-2 rounded-lg text-sm text-gray-600 hover:text-gray-900 hover:bg-gray-100 transition">取消</button>
              <button onClick={saveTrack} className="flex-1 py-2 rounded-lg text-sm font-medium bg-emerald-600 hover:bg-emerald-500 text-white transition">保存验收</button>
            </div>
          </div>
        )}
      </Modal>
    </div>
  );
}

/* ============ 主应用 ============ */
function App() {
  const [store, setStore] = useState(() => localStorage.getItem(STORE_KEY) || '');
  const [view, setView] = useState('submit');
  const [records, setRecords] = useState([]);
  const [syncStatus, setSyncStatus] = useState('connecting');
  const [dashAuth, setDashAuth] = useState(false);
  const [showPwd, setShowPwd] = useState(false);
  const [pwd, setPwd] = useState('');
  const [pwdErr, setPwdErr] = useState('');
  const [localOnly, setLocalOnly] = useState(0);
  const [migrating, setMigrating] = useState(false);

  const isManager = isManagerStore(store);

  const logout = () => { localStorage.removeItem(STORE_KEY); setStore(''); };
  const { show: closing, cancel: cancelClose } = useAutoClose(logout);

  // 管理角色登录后默认进入管理看板；普通门店默认进入提交镜检（刷新/切换门店也回到默认视图）
  useEffect(() => {
    if (!store) return;
    setView(isManager ? 'dashboard' : 'submit');
  }, [store]);

  const openDashboard = () => {
    if (isManager) { setView('dashboard'); return; } // 管理角色免密直接进入
    if (dashAuth) { setView('dashboard'); return; }
    setPwd(''); setPwdErr(''); setShowPwd(true);
  };
  const submitPwd = () => {
    if (pwd === DASH_PWD) { setDashAuth(true); setShowPwd(false); setView('dashboard'); }
    else { setPwdErr('密码错误'); }
  };

  const refresh = useCallback(async () => {
    setSyncStatus('connecting');
    const { data, source } = await loadRecords();
    // 本机遗留记录（id 不是 uuid 的）：仅在云端连上时自动同步到云端，按钮仅作手动兜底
    const localOnlyRecs = data.filter(r => !/^[0-9a-fA-F-]{36}$/.test(r.id || ''));
    if (source === 'cloud' && localOnlyRecs.length > 0) {
      const n = await migrateLocalToCloud();
      if (n > 0) {
        const data2 = await loadRecords(); // 重新拉云端，数据已统一
        setRecords(data2.data);
        setLocalOnly(0);
        setSyncStatus('connected');
        return;
      }
    }
    setRecords(data);
    setLocalOnly(localOnlyRecs.length);
    setSyncStatus(source === 'cloud' ? 'connected' : 'offline');
  }, []);

  const doMigrate = async () => {
    setMigrating(true);
    const n = await migrateLocalToCloud();
    await refresh();
    setMigrating(false);
    if (n > 0) alert(`已同步 ${n} 条记录到云端，手机/其他设备现在也能看到了。`);
    else alert('没有需要同步的本地记录。');
  };

  useEffect(() => {
    if (!store) return;
    refresh();
    let channel = null;
    try {
      channel = supabase.channel('mirror-changes')
        .on('postgres_changes', { event: '*', schema: 'public', table: TABLE }, () => refresh())
        .subscribe();
    } catch (e) {}
    const poll = setInterval(() => { if (document.visibilityState === 'visible') refresh(); }, 12000);
    return () => { if (channel) supabase.removeChannel(channel).catch(() => {}); clearInterval(poll); };
  }, [store, refresh]);

  if (!store) return <LoginScreen onLogin={s => { localStorage.setItem(STORE_KEY, s); setStore(s); }} />;

  return (
    <div className="min-h-screen">
      <header className="sticky top-0 z-40 bg-white/80 backdrop-blur-lg border-b border-gray-200">
        <div className="flex flex-wrap items-center justify-between gap-y-2 px-4 py-2 min-h-[60px] h-auto max-w-5xl mx-auto">
          <div className="flex items-center gap-2.5">
            <div className="w-8 h-8 rounded-lg bg-gradient-to-br from-indigo-500 to-indigo-600 flex items-center justify-center text-white">🔍</div>
            <div>
              <h1 className="text-sm font-bold text-gray-900 leading-tight">{store}</h1>
              <p className="text-xs text-gray-500 leading-tight">
                镜检行动
                <span className={`ml-1 ${syncStatus === 'offline' ? 'text-amber-600' : ''}`}>
                  {syncStatus === 'connected' ? '· 已同步' : syncStatus === 'offline' ? '· 离线模式（数据仅本地）' : '· 连接中'}
                </span>
              </p>
            </div>
          </div>
          <nav className="flex items-center gap-1 flex-wrap justify-end">
            <button onClick={() => setView('submit')}
              className={`px-2 py-1.5 sm:px-3 sm:py-2 rounded-lg text-xs sm:text-sm font-medium transition ${view === 'submit' ? 'bg-indigo-600/20 text-indigo-600 border border-indigo-500/30' : 'text-gray-600 hover:text-gray-900 hover:bg-gray-100'}`}>提交镜检</button>
            {!isManager && (
              <button onClick={() => setView('store')}
                className={`px-2 py-1.5 sm:px-3 sm:py-2 rounded-lg text-xs sm:text-sm font-medium transition ${view === 'store' ? 'bg-indigo-600/20 text-indigo-600 border border-indigo-500/30' : 'text-gray-600 hover:text-gray-900 hover:bg-gray-100'}`}>门店看板</button>
            )}
            {isManager && (
              <button onClick={() => setView('dashboard')}
                className={`px-2 py-1.5 sm:px-3 sm:py-2 rounded-lg text-xs sm:text-sm font-medium transition ${view === 'dashboard' ? 'bg-indigo-600/20 text-indigo-600 border border-indigo-500/30' : 'text-gray-600 hover:text-gray-900 hover:bg-gray-100'}`}>管理看板</button>
            )}
            {isManager && (
              <button onClick={() => setView('monthly')}
                className={`px-2 py-1.5 sm:px-3 sm:py-2 rounded-lg text-xs sm:text-sm font-medium transition ${view === 'monthly' ? 'bg-indigo-600/20 text-indigo-600 border border-indigo-500/30' : 'text-gray-600 hover:text-gray-900 hover:bg-gray-100'}`}>月度看板</button>
            )}
            <button onClick={logout} className="ml-1 px-2 py-1.5 sm:px-3 sm:py-2 rounded-lg text-xs sm:text-sm text-gray-500 hover:text-gray-900 hover:bg-gray-100 transition">退出</button>
          </nav>
        </div>
      </header>

      {localOnly > 0 && (
        <div className="max-w-5xl mx-auto px-4 mt-4">
          <div className="flex items-center gap-3 flex-wrap bg-amber-50 border border-amber-300 rounded-xl px-4 py-3">
            <span className="text-sm text-amber-800">检测到 {localOnly} 条本机记录，正在自动同步到云端（同步后手机/其他设备可见）；若迟迟未同步可手动点击。</span>
            <button onClick={doMigrate} disabled={migrating}
              className="px-3 py-1.5 rounded-lg text-sm font-medium bg-amber-500 hover:bg-amber-400 text-white transition disabled:opacity-50">
              {migrating ? '同步中…' : '手动同步'}
            </button>
          </div>
        </div>
      )}

      {view === 'submit'
        ? <SubmitView currentStore={store} onSubmitted={() => { refresh(); setView(isManager ? 'dashboard' : 'store'); }} />
        : view === 'store'
        ? <StoreDashboardView records={records} currentStore={store} onReload={refresh} />
        : view === 'monthly'
        ? <MonthlyView records={records} currentStore={store} onReload={refresh} />
        : <DashboardView records={records} currentStore={store} onReload={refresh} />}

      <Modal open={showPwd} onClose={() => setShowPwd(false)} title="管理看板密码">
        <div className="space-y-3">
          <p className="text-sm text-gray-500">请输入管理看板密码（415）以查看全部门店数据。</p>
          <input type="password" value={pwd} onChange={e => setPwd(e.target.value)} onKeyDown={e => e.key === 'Enter' && submitPwd()}
            placeholder="请输入密码"
            className="w-full bg-gray-50 border border-gray-300 rounded-lg px-3 py-2 text-sm text-gray-900 outline-none focus:border-indigo-500" />
          {pwdErr && <p className="text-rose-400 text-sm">{pwdErr}</p>}
          <button onClick={submitPwd}
            className="w-full py-2.5 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white font-medium transition">进入</button>
        </div>
      </Modal>

      {closing && (
        <div className="fixed inset-0 z-[60] flex items-center justify-center bg-black/70 backdrop-blur-sm">
          <div className="bg-white border border-gray-300 rounded-2xl p-8 text-center max-w-sm fade-in">
            <h3 className="text-lg font-bold text-gray-900 mb-2">页面即将自动关闭</h3>
            <p className="text-sm text-gray-600 mb-4">已连续 3 分钟没有操作，10 秒后关闭</p>
            <p className="text-xs text-gray-600">动一下鼠标或按任意键即可继续使用</p>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
