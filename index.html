  <script type="text/babel">

const PERIOD_LABELS = { weekday: '周内', weekend: '周末' };

const STATUS_COLOR = {

  done: 'bg-emerald-100 text-emerald-700 border-emerald-300',
  overdue: 'bg-rose-100 text-rose-700 border-rose-300',
};

const SUPABASE_URL = 'https://ltjmbmgofjqeezoskqrc.supabase.co';
const SUPABASE_KEY = 'sb_publishable_KrCOzlUPTcrb8S4-ajTjww_EhKibtaC';
const TABLE = 'mirror_checks';
const STORE_KEY = 'mirror_store';
const LOCAL_KEY = 'mirror_records';

/* ============ Supabase 客户端 ============ */
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/* ============ 工具函数 ============ */
function isoWeek(date) {
  const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
  const dayNum = (d.getUTCDay() + 6) % 7;
  d.setUTCDate(d.getUTCDate() - dayNum + 3);
  const firstThursday = new Date(Date.UTC(d.getUTCFullYear(), 0, 4));
  const week = 1 + Math.round(((d - firstThursday) / 86400000 - 3 + ((firstThursday.getUTCDay() + 6) % 7)) / 7);
  return d.getUTCFullYear() + '-W' + String(week).padStart(2, '0');
}
function uid() { return 'm_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8); }
function todayStr() {
  const d = new Date(); const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
}

/* ============ 数据层（Supabase 优先，localStorage 兜底） ============ */
function loadLocal() { try { return JSON.parse(localStorage.getItem(LOCAL_KEY) || '[]'); } catch (e) { return []; } }
function saveLocal(arr) { localStorage.setItem(LOCAL_KEY, JSON.stringify(arr)); }

async function loadRecords() {
  try {
    const { data, error } = await supabase.from(TABLE).select('*').order('created_at', { ascending: false });
    if (error) throw error;
    return data || [];
  } catch (e) {
    console.warn('[load] 云端失败，用本地兜底', e.message);
    return loadLocal();
  }
}
async function insertRecord(rec) {
  try {
    const { data, error } = await supabase.from(TABLE).insert(rec).select();
    if (error) throw error;
    return data && data[0] ? data[0] : rec;
  } catch (e) {
    console.warn('[insert] 云端失败，写本地', e.message);
    const local = loadLocal(); local.push(rec); saveLocal(local); return rec;
  }
}
async function updateRecord(id, items) {
  const ts = Date.now();
  try {
    const { error } = await supabase.from(TABLE).update({ items, updated_at: ts }).eq('id', id);
    if (error) throw error;
    return true;
  } catch (e) {
    console.warn('[update] 云端失败，写本地', e.message);
    const local = loadLocal().map(r => r.id === id ? { ...r, items, updated_at: ts } : r);
    saveLocal(local); return false;
  }
}

/* ============ 防摸鱼：3 分钟无操作关闭 ============ */
function useAutoClose(onClose) {
  const [show, setShow] = useState(false);
  const timer = useRef(null);
  const closeTimer = useRef(null);
  const reset = useCallback(() => {
    setShow(false);
    if (closeTimer.current) clearTimeout(closeTimer.current);
    if (timer.current) clearTimeout(timer.current);
    timer.current = setTimeout(() => {
      setShow(true);
      closeTimer.current = setTimeout(() => onClose(), 10000);
    }, 180000);
  }, [onClose]);
  useEffect(() => {
    const acts = ['mousemove', 'mousedown', 'keydown', 'touchstart', 'scroll'];
    acts.forEach(a => window.addEventListener(a, reset, { passive: true }));
    reset();
    return () => {
      acts.forEach(a => window.removeEventListener(a, reset));
      if (timer.current) clearTimeout(timer.current);
      if (closeTimer.current) clearTimeout(closeTimer.current);
    };
  }, [reset]);
  return { show, cancel: reset };
}

/* ============ 通用组件 ============ */
function Modal({ open, onClose, title, children, maxWidth = 'max-w-lg' }) {
  if (!open) return null;
  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm" onClick={onClose}>
      <div className={`bg-white border border-gray-300 rounded-2xl shadow-xl w-full ${maxWidth} max-h-[90vh] overflow-y-auto fade-in`} onClick={e => e.stopPropagation()}>
        <div className="flex items-center justify-between px-5 py-4 border-b border-gray-200 sticky top-0 bg-white z-10">
          <h3 className="text-base font-bold text-gray-900">{title}</h3>
          <button onClick={onClose} className="text-gray-600 hover:text-gray-900 text-xl leading-none">×</button>
        </div>
        <div className="p-5">{children}</div>
      </div>
    </div>
  );
}

function Badge({ text, cls }) {
  return <span className={`inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium border ${cls || 'bg-gray-600/20 text-gray-300 border-gray-600/40'}`}>{text}</span>;
}

      </div>

/* ============ 提交镜检 ============ */
function emptyItem() { return { id: uid(), category: 'product', sub: PRODUCT_SUBS[0], desc: '', solution: '', due_date: '', status: 'pending', rework_note: '' }; }

function SubmitView({ currentStore, onSubmitted }) {
  const [period, setPeriod] = useState('weekday');
  const [target, setTarget] = useState(currentStore);
  const [items, setItems] = useState([emptyItem()]);
  const [saving, setSaving] = useState(false);
  const [err, setErr] = useState('');

  useEffect(() => { setTarget(currentStore); }, [currentStore]);

  const setItem = (i, patch) => setItems(prev => prev.map((it, idx) => idx === i ? { ...it, ...patch } : it));
  const addItem = () => setItems(prev => prev.length < 3 ? [...prev, emptyItem()] : prev);
  const delItem = (i) => setItems(prev => prev.length > 1 ? prev.filter((_, idx) => idx !== i) : prev);

  const onCat = (i, cat) => setItem(i, { category: cat, sub: SUBS_BY_CAT[cat][0] });

  const submit = async () => {
    setErr('');
    const filled = items.filter(it => it.desc.trim());
    if (filled.length < 1 || filled.length > 3) { setErr('请填写 1–3 个问题'); return; }
    if (!target) { setErr('请选择被检查的门店'); return; }
    setSaving(true);
    const rec = {
      id: uid(),
      submitter_store: currentStore,
      target_store: target,
      period,
      week_label: isoWeek(new Date()),
      items: items.map(it => ({ ...it, desc: it.desc.trim(), solution: it.solution.trim(), rework_note: it.rework_note.trim() })),
      created_at: new Date().toISOString(),
      updated_at: new Date().toISOString(),
    };
    try {
      await insertRecord(rec);
      onSubmitted();
    } catch (e) {
      setErr('提交失败：' + e.message);
    } finally {
      setSaving(false);
    }
  };

  return (
    <div className="max-w-3xl mx-auto px-4 py-6 fade-in">
      <h2 className="text-lg font-bold text-gray-900 mb-1">提交镜检</h2>
      <p className="text-sm text-gray-500 mb-5">看负责门店的监控回放，找出最该改的 1–3 件事。</p>

      <div className="bg-white border border-gray-200 rounded-xl p-5 mb-4">
        <div className="flex flex-wrap gap-4 mb-4">
          <div>
            <label className="block text-xs text-gray-500 mb-1">检查时段</label>
            <div className="flex gap-2">
              {['weekday', 'weekend'].map(p => (
                <button key={p} onClick={() => setPeriod(p)}
                  className={`px-4 py-2 rounded-lg text-sm font-medium border transition ${period === p ? 'bg-indigo-50 text-indigo-700 border-indigo-300' : 'text-gray-600 border-gray-300 hover:bg-gray-100'}`}>
                  {PERIOD_LABELS[p]}
                </button>
              ))}
            </div>
          </div>
          <div className="flex-1 min-w-[200px]">
            <label className="block text-xs text-gray-500 mb-1">被检查门店（可跨店帮带）</label>
            <select value={target} onChange={e => setTarget(e.target.value)}
              className="w-full bg-gray-50 border border-gray-300 rounded-lg px-3 py-2 text-gray-900 focus:border-indigo-500 outline-none">
              {STORE_LIST.map(s => <option key={s} value={s}>{s}</option>)}
            </select>
          </div>
        </div>

        <div className="space-y-3">
          {items.map((it, i) => (
            <div key={it.id} className="border border-gray-200 rounded-lg p-4 bg-gray-50">
              <div className="flex items-center justify-between mb-3">
                <span className="text-sm font-medium text-indigo-600">问题 {i + 1}</span>
                {items.length > 1 && (
                  <button onClick={() => delItem(i)} className="text-xs text-gray-500 hover:text-rose-400">删除</button>
                )}
              </div>
              <div className="flex gap-2 mb-3">
                {['product', 'service'].map(c => (
                  <button key={c} onClick={() => onCat(i, c)}
                    className={`px-3 py-1.5 rounded-lg text-xs font-medium border transition ${it.category === c ? 'bg-indigo-50 text-indigo-700 border-indigo-300' : 'text-gray-600 border-gray-300 hover:bg-gray-100'}`}>
                    {c === 'product' ? '产品' : '服务'}
                  </button>
                ))}
                <select value={it.sub} onChange={e => setItem(i, { sub: e.target.value })}
                  className="flex-1 bg-gray-50 border border-gray-300 rounded-lg px-2 py-1.5 text-sm text-gray-900 focus:border-indigo-500 outline-none">
                  {SUBS_BY_CAT[it.category].map(s => <option key={s} value={s}>{s}</option>)}
                </select>
              </div>
              <textarea value={it.desc} onChange={e => setItem(i, { desc: e.target.value })}
                rows={3} placeholder="描述你看到的问题（建议找伙伴确认他能理解你写的话）"
                className="w-full bg-gray-50 border border-gray-300 rounded-lg px-3 py-2 text-sm text-gray-900 placeholder-gray-400 focus:border-indigo-500 outline-none resize-none" />
            </div>
          ))}
        </div>

        {items.length < 3 && (
          <button onClick={addItem} className="mt-3 w-full py-2 rounded-lg border border-dashed border-gray-300 text-sm text-gray-600 hover:border-indigo-500 hover:text-indigo-600 transition">+ 再加一个问题（最多 3 个）</button>
        )}
      </div>

      {err && <p className="text-rose-400 text-sm mb-3">{err}</p>}
      <button onClick={submit} disabled={saving}
        className="w-full py-2.5 rounded-lg bg-indigo-600 hover:bg-indigo-500 disabled:opacity-50 text-white font-medium transition">
        {saving ? '提交中…' : '提交镜检'}
      </button>
    </div>
  );
}

/* ============ 管理看板 ============ */
function DashboardView({ records, currentStore, onReload }) {
  const [storeFilter, setStoreFilter] = useState('all');
  const [periodFilter, setPeriodFilter] = useState('all');
  const [statusFilter, setStatusFilter] = useState('all');
  const [rework, setRework] = useState(null);

  const allItems = useMemo(() => {
    const out = [];
    records.forEach(r => (r.items || []).forEach(it => out.push({ ...it, _record: r })));
    return out;
  }, [records]);

  const filtered = allItems.filter(it => {
    if (storeFilter !== 'all' && it._record.target_store !== storeFilter) return false;
    if (periodFilter !== 'all' && it._record.period !== periodFilter) return false;
    if (statusFilter !== 'all' && it.status !== statusFilter) return false;
    return true;
  });

  const grouped = useMemo(() => {
    const m = {};
    filtered.forEach(it => {
      const k = it._record.target_store;
      (m[k] = m[k] || []).push(it);
    });
    return m;
  }, [filtered]);

  const canEdit = (rec) => rec.target_store === currentStore;

  const saveRework = async () => {
    const { recordId, itemId, solution, due_date, status, rework_note } = rework;
    const rec = records.find(r => r.id === recordId);
    if (!rec) return;
    const newItems = rec.items.map(it =>
      it.id === itemId ? { ...it, solution, due_date, status, rework_note: status === 'overdue' ? rework_note : it.rework_note } : it
    );
    await updateRecord(recordId, newItems);
    setRework(null);
    onReload();
  };

  return (
    <div className="max-w-5xl mx-auto px-4 py-6 fade-in">
      <h2 className="text-lg font-bold text-gray-900 mb-1">管理看板 · 按门店汇总</h2>
      <p className="text-sm text-gray-500 mb-4">后台按被检查门店分类，可填解决方案与整改节点做复盘。</p>

      <div className="flex flex-wrap gap-3 mb-5">
        <select value={storeFilter} onChange={e => setStoreFilter(e.target.value)}
          className="bg-gray-50 border border-gray-300 rounded-lg px-2 py-1.5 text-sm text-gray-900 outline-none">
          <option value="all">全部门店</option>
          {STORE_LIST.map(s => <option key={s} value={s}>{s}</option>)}
        </select>
        <select value={periodFilter} onChange={e => setPeriodFilter(e.target.value)}
          className="bg-gray-50 border border-gray-300 rounded-lg px-2 py-1.5 text-sm text-gray-900 outline-none">
          <option value="all">全部时段</option>
          <option value="weekday">周内</option>
          <option value="weekend">周末</option>
        </select>
        <select value={statusFilter} onChange={e => setStatusFilter(e.target.value)}
          className="bg-gray-50 border border-gray-300 rounded-lg px-2 py-1.5 text-sm text-gray-900 outline-none">
          <option value="all">全部状态</option>
          <option value="pending">待整改</option>
          <option value="done">已完成</option>
          <option value="overdue">已超期</option>
        </select>
        <span className="text-sm text-gray-500 self-center">共 {filtered.length} 个问题</span>
      </div>

      {filtered.length === 0 && <p className="text-gray-500 text-sm py-10 text-center">暂无数据，去提交一条镜检吧。</p>}

      {Object.keys(grouped).map(store => (
        <div key={store} className="mb-6">
          <div className="flex items-center gap-2 mb-2">
            <h3 className="text-base font-semibold text-gray-900">{store}</h3>
            <Badge text={`${grouped[store].length} 项`} />
            {store === currentStore && <Badge text="本店可复盘" cls="bg-indigo-50 text-indigo-700 border-indigo-300" />}
          </div>
          <div className="grid gap-3 md:grid-cols-2">
            {grouped[store].map(it => (
              <div key={it.id} className="bg-white border border-gray-200 rounded-xl p-4">
                <div className="flex items-center gap-2 mb-2 flex-wrap">
                  <Badge text={it.category === 'product' ? '产品' : '服务'} />
                  <Badge text={it.sub} cls="bg-gray-600/20 text-gray-300 border-gray-600/40" />
                  <Badge text={STATUS_LABELS[it.status] || '待整改'} cls={STATUS_COLOR[it.status] || ''} />
                </div>
                <p className="text-sm text-gray-700 leading-relaxed mb-2">{it.desc}</p>
                <p className="text-xs text-gray-500 mb-1">提交人：{it._record.submitter_store} · {PERIOD_LABELS[it._record.period]} · {it._record.week_label}</p>
                {it.solution && <p className="text-xs text-emerald-600 mb-1">方案：{it.solution}{it.due_date ? `（节点 ${it.due_date}）` : ''}</p>}
                {it.status === 'overdue' && it.rework_note && <p className="text-xs text-rose-600 mb-1">重盘：{it.rework_note}</p>}
                {canEdit(it._record) && (
                  <button onClick={() => setRework({ recordId: it._record.id, itemId: it.id, solution: it.solution, due_date: it.due_date, status: it.status, rework_note: it.rework_note })}
                    className="mt-2 text-xs px-3 py-1.5 rounded-lg bg-indigo-50 text-indigo-700 border border-indigo-300 hover:bg-indigo-100 transition">复盘 / 跟进</button>
                )}
              </div>
            ))}
          </div>
        </div>
      ))}

      <Modal open={!!rework} onClose={() => setRework(null)} title="复盘跟进">
        {rework && (
          <div className="space-y-3">
            <div>
              <label className="block text-xs text-gray-500 mb-1">整改状态</label>
              <select value={rework.status} onChange={e => setRework({ ...rework, status: e.target.value })}
                className="w-full bg-gray-50 border border-gray-300 rounded-lg px-3 py-2 text-gray-900 outline-none">
                <option value="pending">待整改</option>
                <option value="done">已完成</option>
                <option value="overdue">已超期（需重新复盘）</option>
              </select>
            </div>
            <div>
              <label className="block text-xs text-gray-500 mb-1">解决方案</label>
              <textarea value={rework.solution} onChange={e => setRework({ ...rework, solution: e.target.value })} rows={3}
                placeholder="针对这个问题怎么改"
                className="w-full bg-gray-50 border border-gray-300 rounded-lg px-3 py-2 text-sm text-gray-900 placeholder-gray-400 outline-none resize-none" />
            </div>
            <div>
              <label className="block text-xs text-gray-500 mb-1">整改时间节点</label>
              <input type="date" value={rework.due_date} onChange={e => setRework({ ...rework, due_date: e.target.value })}
                className="w-full bg-gray-50 border border-gray-300 rounded-lg px-3 py-2 text-sm text-gray-900 outline-none" />
            </div>
            {rework.status === 'overdue' && (
              <div>
                <label className="block text-xs text-gray-500 mb-1">重新复盘说明（为何未达成）</label>
                <textarea value={rework.rework_note} onChange={e => setRework({ ...rework, rework_note: e.target.value })} rows={2}
                  className="w-full bg-gray-50 border border-gray-300 rounded-lg px-3 py-2 text-sm text-gray-900 placeholder-gray-400 outline-none resize-none" />
              </div>
            )}
            <div className="flex gap-2 pt-1">
              <button onClick={() => setRework(null)} className="flex-1 py-2 rounded-lg text-sm text-gray-600 hover:text-gray-900 hover:bg-gray-100 transition">取消</button>
              <button onClick={saveRework} className="flex-1 py-2 rounded-lg text-sm font-medium bg-indigo-600 hover:bg-indigo-500 text-white transition">保存</button>
            </div>
          </div>
        )}
      </Modal>
    </div>
  );
}

/* ============ 主应用 ============ */
function App() {
  const [store, setStore] = useState(() => localStorage.getItem(STORE_KEY) || '');
  const [view, setView] = useState('submit');
  const [records, setRecords] = useState([]);
  const [syncStatus, setSyncStatus] = useState('connecting');

  const logout = () => { localStorage.removeItem(STORE_KEY); setStore(''); };
  const { show: closing, cancel: cancelClose } = useAutoClose(logout);

  const refresh = useCallback(async () => {
    setSyncStatus('connecting');
    const data = await loadRecords();
    setRecords(data);
    setSyncStatus('connected');
  }, []);

  useEffect(() => {
    if (!store) return;
    refresh();
    let channel = null;
    try {
      channel = supabase.channel('mirror-changes')
        .on('postgres_changes', { event: '*', schema: 'public', table: TABLE }, () => refresh())
        .subscribe();
    } catch (e) {}
    const poll = setInterval(() => { if (document.visibilityState === 'visible') refresh(); }, 12000);
    return () => { if (channel) supabase.removeChannel(channel).catch(() => {}); clearInterval(poll); };
  }, [store, refresh]);

  if (!store) return <LoginScreen onLogin={s => { localStorage.setItem(STORE_KEY, s); setStore(s); }} />;

  return (
    <div className="min-h-screen">
      <header className="sticky top-0 z-40 bg-white/80 backdrop-blur-lg border-b border-gray-200">
        <div className="flex items-center justify-between px-4 h-[60px] max-w-5xl mx-auto">
          <div className="flex items-center gap-2.5">
            <div className="w-8 h-8 rounded-lg bg-gradient-to-br from-indigo-500 to-indigo-600 flex items-center justify-center text-white">🔍</div>
            <div>
              <h1 className="text-sm font-bold text-gray-900 leading-tight">{store}</h1>
              <p className="text-xs text-gray-500 leading-tight">
                镜检行动
                <span className="ml-1">{syncStatus === 'connected' ? '· 已同步' : '· 连接中'}</span>
              </p>
            </div>
          </div>
          <nav className="flex items-center gap-1">
            <button onClick={() => setView('submit')}
              className={`px-3 py-2 rounded-lg text-sm font-medium transition ${view === 'submit' ? 'bg-indigo-600/20 text-indigo-600 border border-indigo-500/30' : 'text-gray-600 hover:text-gray-900 hover:bg-gray-100'}`}>提交镜检</button>
            <button onClick={() => setView('dashboard')}
              className={`px-3 py-2 rounded-lg text-sm font-medium transition ${view === 'dashboard' ? 'bg-indigo-600/20 text-indigo-600 border border-indigo-500/30' : 'text-gray-600 hover:text-gray-900 hover:bg-gray-100'}`}>管理看板</button>
            <button onClick={logout} className="ml-1 px-3 py-2 rounded-lg text-sm text-gray-500 hover:text-gray-900 hover:bg-gray-100 transition">退出</button>
          </nav>
        </div>
      </header>

      {view === 'submit'
        ? <SubmitView currentStore={store} onSubmitted={() => { refresh(); setView('dashboard'); }} />
        : <DashboardView records={records} currentStore={store} onReload={refresh} />}

      {closing && (
        <div className="fixed inset-0 z-[60] flex items-center justify-center bg-black/70 backdrop-blur-sm">
          <div className="bg-white border border-gray-300 rounded-2xl p-8 text-center max-w-sm fade-in">
            <h3 className="text-lg font-bold text-gray-900 mb-2">页面即将自动关闭</h3>
            <p className="text-sm text-gray-600 mb-4">已连续 3 分钟没有操作，10 秒后关闭</p>
            <p className="text-xs text-gray-600">动一下鼠标或按任意键即可继续使用</p>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
